<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AQUAPLAN - 競泳メニュー作成アシスタント</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');

    :root {
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --primary-light: #e0f2fe;
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #cbd5e1;
      --accent: #d97706;
      --accent-light: #fffbeb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', 'Noto Sans JP', -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); line-height: 1.5; padding: 20px; max-width: 980px; margin: 0 auto; }

    header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; border-bottom: 2px solid var(--primary); padding-bottom: 12px; }
    header h1 { color: var(--primary-dark); font-size: 1.6rem; letter-spacing: -0.02em; font-weight: 700; }
    header p { font-size: 0.85rem; color: var(--text-muted); font-weight: 500; }

    .card { background: var(--card-bg); border-radius: 12px; padding: 18px; margin-bottom: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid var(--border); }
    .card-title { font-weight: 700; margin-bottom: 14px; color: var(--primary-dark); font-size: 1.05rem; border-bottom: 1px solid #e2e8f0; padding-bottom: 6px; display: flex; align-items: center; justify-content: space-between; }

    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
    .form-group { margin-bottom: 10px; }
    label { display: block; font-size: 0.82rem; font-weight: 600; color: #334155; margin-bottom: 5px; }
    input, select, button { width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); font-size: 0.9rem; background-color: #fff; color: var(--text); outline: none; transition: all 0.2s; }
    input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15); }

    .checkbox-group { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
    .checkbox-item { display: flex; align-items: center; gap: 5px; font-size: 0.85rem; cursor: pointer; }
    .checkbox-item input { width: auto; cursor: pointer; }

    .btn { background: var(--primary); color: white; border: none; font-weight: 700; cursor: pointer; transition: background 0.2s, transform 0.1s; padding: 10px 16px; border-radius: 8px; }
    .btn:hover { background: var(--primary-dark); }
    .btn:active { transform: scale(0.99); }
    .btn-secondary { background: #64748b; }
    .btn-secondary:hover { background: #475569; }
    .btn-danger { background: #ef4444; }
    .btn-danger:hover { background: #dc2626; }
    .btn-sm { padding: 4px 8px; font-size: 0.75rem; width: auto; border-radius: 6px; }

    /* Stats Bar */
    .stats-bar { display: flex; gap: 15px; justify-content: center; margin-bottom: 18px; }
    .stat-badge { background: var(--primary-light); color: var(--primary-dark); padding: 8px 20px; border-radius: 30px; font-weight: 700; font-size: 0.95rem; border: 1px solid #bae6fd; }

    /* Phase Cards */
    .phase-card { background: #fff; border: 1px solid var(--border); border-left: 5px solid var(--primary); padding: 14px 16px; margin-bottom: 12px; border-radius: 8px; transition: shadow 0.2s; }
    .phase-card.is-set { border-left-color: var(--accent); background: #fafaf9; }

    .phase-header { display: flex; justify-content: space-between; align-items: center; font-weight: 700; margin-bottom: 8px; border-bottom: 1px dashed #e2e8f0; padding-bottom: 6px; }
    .phase-title-text { font-size: 0.95rem; font-weight: 700; color: #0f172a; border: none; background: transparent; width: 140px; }
    
    .phase-main-line { font-size: 1rem; font-weight: 600; color: #0f172a; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .phase-note { font-size: 0.82rem; color: #475569; margin-top: 8px; font-style: italic; display: flex; align-items: center; gap: 4px; }

    .intensity-badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; color: #fff; background: #64748b; margin-left: 6px; }
    .int-A1, .int-A2 { background: #10b981; }
    .int-En1, .int-En2 { background: #0284c7; }
    .int-En3 { background: #f59e0b; }
    .int-Sp1, .int-Sp2, .int-Sp3 { background: #ef4444; }

    .timeline-tag { font-size: 0.8rem; background: #f1f5f9; color: #475569; padding: 2px 8px; border-radius: 6px; font-weight: 500; }

    .preset-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-bottom: 1px solid #f1f5f9; }
    .tag-sm { font-size: 0.7rem; background: #e2e8f0; padding: 2px 6px; border-radius: 4px; margin-right: 4px; font-weight: 600; }

    .sub-item-line { margin-left: 12px; padding: 5px 0; border-bottom: 1px solid #f8fafc; font-size: 0.95rem; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }

    /* Editable Inline Inputs */
    .edit-num { width: 52px !important; display: inline-block; padding: 3px 4px; text-align: center; font-weight: 700; }
    .edit-text { width: 220px !important; display: inline-block; padding: 3px 6px; }
    .edit-cycle { width: 65px !important; display: inline-block; padding: 3px 4px; text-align: center; }
    .edit-note { width: 100% !important; padding: 3px 8px; font-size: 0.82rem; border: 1px solid #e2e8f0; }

    /* 🖨 印刷用 (A4レイアウト最適化) */
    @media print {
      body { background: white; padding: 0; color: #000; font-size: 11pt; }
      .no-print, header, .card-title span.no-print { display: none !important; }
      .card { box-shadow: none; border: none; padding: 0; margin-bottom: 0; }
      .phase-card { page-break-inside: avoid; border: 1px solid #94a3b8; margin-bottom: 10px; padding: 8px 12px; background: #fff !important; }
      .phase-header { border-bottom: 1px solid #cbd5e1; }
      .stat-badge { border: 1px solid #000; color: #000; background: none; }
      input, select { border: none !important; background: transparent !important; padding: 0 !important; width: auto !important; font-weight: bold; }
      .edit-text { width: auto !important; }
      .edit-note { border: none !important; padding: 0 !important; }
      .timeline-tag { border: 1px solid #cbd5e1; background: none; }
    }
  </style>
</head>
<body>

<header class="no-print">
  <div>
    <h1>AQUAPLAN</h1>
    <p>競泳トレーニングメニュー作成アシスタント</p>
  </div>
</header>

<!-- 1. パラメータ設定 -->
<div class="card no-print">
  <div class="card-title">1. コンディション & パラメータ設定</div>
  <div class="grid-3">
    <div class="form-group">
      <label>目標時間 (15分〜180分)</label>
      <input type="number" id="targetTime" value="120" min="15" max="180" step="5">
    </div>
    <div class="form-group">
      <label>水路長 (プール)</label>
      <select id="poolLength">
        <option value="25">短水路 (25m)</option>
        <option value="50">長水路 (50m)</option>
      </select>
    </div>
    <div class="form-group">
      <label>100m参考タイム (分:秒)</label>
      <input type="text" id="refTime" value="1:05.0" placeholder="例: 1:05.0">
    </div>
  </div>

  <div class="grid-3">
    <div class="form-group">
      <label>メインフォーカス</label>
      <select id="focusType">
        <option value="Aerobic">Aerobic (持久力・ベース)</option>
        <option value="Speed">Speed (耐乳酸・スプリント)</option>
        <option value="Technique">Technique (フォーム・ドリル)</option>
      </select>
    </div>

    <!-- ⭐️ ロングセッション時の構成傾向 (シャオ提案のロジック) -->
    <div class="form-group">
      <label>ロングセッション構成タイプ (90分超)</label>
      <select id="longSessionStyle">
        <option value="multi" selected>多段メイン重視 (Main 1〜3分割)</option>
        <option value="base">基礎・ドリル充実 (Kick/Pull/Drill重視)</option>
        <option value="single">単一大量本数 (メンタル・耐乳酸)</option>
      </select>
    </div>

    <div class="form-group">
      <label>使用可能ツール</label>
      <div class="checkbox-group">
        <label class="checkbox-item"><input type="checkbox" class="gear-check" value="Fin" checked> Fin</label>
        <label class="checkbox-item"><input type="checkbox" class="gear-check" value="Paddle" checked> Paddle</label>
        <label class="checkbox-item"><input type="checkbox" class="gear-check" value="Snorkel" checked> Snorkel</label>
        <label class="checkbox-item"><input type="checkbox" class="gear-check" value="Pull Buoy" checked> Pull</label>
        <label class="checkbox-item"><input type="checkbox" class="gear-check" value="Board" checked> Board</label>
      </div>
    </div>
  </div>

  <button class="btn" onclick="generateMenu()" style="margin-top:12px; font-size:1rem; padding:12px;">メニューを自動生成する</button>
</div>

<!-- 2. プリセットライブラリ -->
<div class="card no-print">
  <div class="card-title">2. プリセットライブラリ (デフォルト & カスタム)</div>
  <div class="grid-3">
    <input type="text" id="presetName" placeholder="メニュー名 (例: 25m Max Sprint)">
    <select id="presetPhase">
      <option value="Warm Up">Warm Up</option>
      <option value="Kick">Kick</option>
      <option value="Pull">Pull</option>
      <option value="Drill">Drill</option>
      <option value="Main" selected>Main</option>
      <option value="Down">Down</option>
    </select>
    <select id="presetIntensity">
      <option value="A1">A1 (Rest/Easy)</option>
      <option value="En1">En1 (Base)</option>
      <option value="En2">En2 (AT Pace)</option>
      <option value="En3">En3 (VO2max)</option>
      <option value="Sp1">Sp1 (Tolerance)</option>
      <option value="Sp3">Sp3 (Peak Speed)</option>
    </select>
  </div>
  <div class="grid-2" style="margin-top:8px;">
    <select id="presetStyle">
      <option value="Fr">Fr</option>
      <option value="Ba">Ba</option>
      <option value="Br">Br</option>
      <option value="Fly">Fly</option>
      <option value="IM">IM</option>
      <option value="Choice" selected>Choice/無指定</option>
    </select>
    <input type="text" id="presetDetail" placeholder="詳細・ワンポイント解説">
  </div>
  
  <div class="form-group" style="margin-top:8px;">
    <label>使用ツールタグ:</label>
    <div class="checkbox-group">
      <label class="checkbox-item"><input type="checkbox" class="preset-gear-check" value="Fin"> Fin</label>
      <label class="checkbox-item"><input type="checkbox" class="preset-gear-check" value="Paddle"> Paddle</label>
      <label class="checkbox-item"><input type="checkbox" class="preset-gear-check" value="Snorkel"> Snorkel</label>
      <label class="checkbox-item"><input type="checkbox" class="preset-gear-check" value="Pull Buoy"> Pull Buoy</label>
      <label class="checkbox-item"><input type="checkbox" class="preset-gear-check" value="Board"> Board</label>
    </div>
  </div>

  <button class="btn btn-secondary" onclick="savePreset()" style="margin-top:8px; padding:6px 12px;">オリジナルメニューとしてライブラリへ保存</button>

  <div style="margin-top:14px; border-top:1px dashed var(--border); padding-top:10px;">
    <label>ライブラリ検索 (キーワード・種目・ツールなど):</label>
    <input type="text" id="presetSearch" placeholder="検索ワードを入力..." oninput="loadPresets()">
  </div>
  <div id="presetList" style="margin-top:8px; max-height:180px; overflow-y:auto;"></div>
</div>

<!-- 3. メニュー表示エリア -->
<div class="card">
  <div class="card-title">
    <span>トレーニングメニュー</span>
    <button class="btn btn-sm no-print" onclick="window.print()">印刷 / PDF出力</button>
  </div>

  <div class="stats-bar">
    <div class="stat-badge" id="totalDistanceBadge">総距離: 0 m</div>
    <div class="stat-badge" id="totalTimeBadge">全体時間: 約 0 分</div>
  </div>

  <div id="menuContainer">
    <!-- 動的描画 -->
  </div>
</div>

<script>
// --- 標準プリセット ---
const defaultPresets = [
  { id: 'def-1', name: "SKPS (認知ウォーミングアップ)", phase: "Warm Up", intensity: "A1", style: "Choice", detail: "Swim / Kick / Pull / Swim 順に体温を上昇", gear: "" },
  { id: 'def-2', name: "Sculling Front/Middle", phase: "Drill", intensity: "A2", style: "Choice", detail: "キャッチポジションでの水捉えと肘立て意識", gear: "Snorkel" },
  { id: 'def-3', name: "1-Arm Drill (片手スイム)", phase: "Drill", intensity: "A2", style: "Choice", detail: "軸のぶれ防止と逆腕の固定意識", gear: "Fin" },
  { id: 'def-4', name: "Catch-Up Drill", phase: "Drill", intensity: "A2", style: "Choice", detail: "エントリー後の伸びと前方でのタメの確保", gear: "" },
  { id: 'def-5', name: "Kick Build-Up", phase: "Kick", intensity: "En1", style: "Choice", detail: "1t-3tにかけて徐々に足振りを力強く", gear: "Board" },
  { id: 'def-6', name: "Pull Paddle Keep", phase: "Pull", intensity: "En2", style: "Fr", detail: "キャッチからキャッチへの滑らかなつながり", gear: "Paddle,Pull Buoy" },
  { id: 'def-7', name: "AT Pace Descending", phase: "Main", intensity: "En2", style: "Fr", detail: "心肺機能の強化とAT心拍維持", gear: "" },
  { id: 'def-8', name: "All-Out Max Sprint", phase: "Main", intensity: "Sp2", style: "Choice", detail: "25m完全ハード・最大泳速の維持", gear: "Fin,Paddle" },
  { id: 'def-9', name: "400m Long Distance Keep", phase: "Main", intensity: "En1", style: "Fr", detail: "一定ペースの維持・イーブンペースの徹底", gear: "" }
];

let currentMenu = [];

function parseRefTimeToSeconds(str) {
  if (!str) return 65;
  const parts = str.split(':');
  if (parts.length === 2) return (parseFloat(parts[0]) * 60) + parseFloat(parts[1]);
  return parseFloat(str) || 65;
}

function parseCycleToSeconds(str) {
  if (!str) return 60;
  if (typeof str === 'number') return str;
  const s = String(str).replace('@', '').trim();
  const parts = s.split(':');
  if (parts.length === 2) return (parseInt(parts[0]) * 60) + parseInt(parts[1]);
  return parseInt(s) || 60;
}

function roundTo5Sec(sec) {
  return Math.ceil(sec / 5) * 5;
}

function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.round(sec % 60);
  return `${m}:${s < 10 ? '0' : ''}${s}`;
}

function calculateCycle(dist, intensity, refSec100) {
  let basePace = (refSec100 / 100) * dist;
  let addSec = 0;
  switch(intensity) {
    case 'A1': case 'A2': addSec = dist * 0.30; break;
    case 'En1': addSec = dist * 0.20; break;
    case 'En2': addSec = dist * 0.15; break;
    case 'En3': addSec = dist * 0.25; break;
    case 'Sp1': case 'Sp2': addSec = dist * 0.45; break;
    case 'Sp3': addSec = dist * 0.70; break;
    default: addSec = dist * 0.20;
  }
  return roundTo5Sec(basePace + addSec);
}

function getPhaseSeconds(item) {
  if (item.isSet) {
    let subSec = 0;
    item.subItems.forEach(s => {
      const cSec = parseCycleToSeconds(s.cycle);
      subSec += (parseInt(s.count) || 1) * cSec;
    });
    return (subSec * (parseInt(item.sets) || 1)) + (((parseInt(item.sets) || 1) - 1) * (parseInt(item.setRest) || 0));
  }
  const cSec = parseCycleToSeconds(item.cycle);
  return (parseInt(item.count) || 1) * cSec;
}

function calculateTotalStats() {
  let totalDist = 0;
  let totalSec = 0;

  currentMenu.forEach(item => {
    totalSec += getPhaseSeconds(item);
    if (item.isSet) {
      let subDist = 0;
      item.subItems.forEach(s => subDist += (parseInt(s.dist) || 0) * (parseInt(s.count) || 0));
      totalDist += subDist * (parseInt(item.sets) || 1);
    } else {
      totalDist += (parseInt(item.dist) || 0) * (parseInt(item.count) || 0);
    }
  });

  document.getElementById("totalDistanceBadge").innerText = `総距離: ${totalDist.toLocaleString()} m`;
  document.getElementById("totalTimeBadge").innerText = `全体時間: 約 ${Math.floor(totalSec / 60)}分 ${totalSec % 60}秒`;
}

// --- メニュー自動生成メイン ---
function generateMenu() {
  const targetMinutes = parseInt(document.getElementById("targetTime").value) || 60;
  const poolLen = parseInt(document.getElementById("poolLength").value) || 25;
  const refSec100 = parseRefTimeToSeconds(document.getElementById("refTime").value);
  const focus = document.getElementById("focusType").value;
  const longStyle = document.getElementById("longSessionStyle").value;
  const selectedGears = Array.from(document.querySelectorAll('.gear-check:checked')).map(cb => cb.value);

  currentMenu = [];

  // 1. Warm Up (時間に応じて動的調整)
  let wuDist = targetMinutes >= 120 ? 800 : (targetMinutes >= 90 ? 400 : (targetMinutes <= 30 ? 100 : 300));
  currentMenu.push({
    phase: "Warm Up",
    style: "Choice",
    dist: wuDist,
    count: 1,
    cycle: calculateCycle(wuDist, 'A1', refSec100),
    intensity: "A1",
    desc: "SKPS Choice",
    gear: "",
    note: "ウォーミングアップと動的ストレッチ"
  });

  if (targetMinutes <= 30) {
    // ショートセッション（30分以下）
    let sDist = poolLen === 50 ? 50 : 25;
    currentMenu.push({
      phase: "Main",
      style: "Choice",
      dist: sDist,
      count: Math.floor((targetMinutes * 60 - 300) / calculateCycle(sDist, 'Sp2', refSec100)),
      cycle: calculateCycle(sDist, 'Sp2', refSec100),
      intensity: "Sp2",
      desc: "High Density Sprint",
      gear: selectedGears.includes("Fin") ? "Fin" : "",
      note: "短時間・高密度セッション"
    });
  } else if (targetMinutes >= 90 && longStyle === "multi") {
    // ⭐️ シャオ基本推奨: 多段メイン構成 (Main 1 〜 Main 3)
    
    // Drill & Kick 基礎構築
    currentMenu.push({
      phase: "Drill & Form",
      style: "Choice",
      dist: poolLen === 50 ? 50 : 25,
      count: 8,
      cycle: calculateCycle(poolLen === 50 ? 50 : 25, 'A2', refSec100),
      intensity: "A2",
      desc: "Technique Drill",
      gear: selectedGears.includes("Snorkel") ? "Snorkel" : "",
      note: "キャッチポジションと姿勢の確認"
    });

    currentMenu.push({
      phase: "Kick & Pull",
      isSet: true,
      sets: 2,
      setRest: 45,
      intensity: "En1",
      note: "下半身・上半身それぞれの推進力強化",
      subItems: [
        { dist: 50, count: 4, cycle: calculateCycle(50, 'En1', refSec100), desc: "Kick Build-Up", gear: selectedGears.includes("Board") ? "Board" : "" },
        { dist: 50, count: 4, cycle: calculateCycle(50, 'En1', refSec100), desc: "Pull Smooth", gear: selectedGears.includes("Paddle") ? "Paddle" : "" }
      ]
    });

    // Main 1: スピード/テクニック
    currentMenu.push({
      phase: "Main 1 (Speed)",
      style: "Choice",
      dist: 50,
      count: 8,
      cycle: calculateCycle(50, 'Sp1', refSec100),
      intensity: "Sp1",
      desc: "25m Hard / 25m Easy",
      gear: selectedGears.includes("Fin") ? "Fin" : "",
      note: "最大心拍近くまで負荷を上げる"
    });

    // Main 2: ベース持久力 (セット構造)
    currentMenu.push({
      phase: "Main 2 (Aerobic)",
      isSet: true,
      sets: 3,
      setRest: 60,
      intensity: "En2",
      note: "ATペースの徹底維持",
      subItems: [
        { dist: 100, count: 2, cycle: calculateCycle(100, 'En2', refSec100), desc: "Pace Keep", gear: "" },
        { dist: 50, count: 2, cycle: calculateCycle(50, 'En3', refSec100), desc: "Hard Build-Up", gear: "" }
      ]
    });

    // Main 3: 追い込み・ロングイーブン
    currentMenu.push({
      phase: "Main 3 (Pace)",
      style: "Fr",
      dist: 400,
      count: 2,
      cycle: calculateCycle(400, 'En1', refSec100),
      intensity: "En1",
      desc: "Even Pace Keep",
      gear: "",
      note: "💡 Point: 1t目 イーブン / 2t目 100mごとのビルドアップ"
    });

  } else if (targetMinutes >= 90 && longStyle === "base") {
    // ⭐️ 基礎・ドリル充実タイプ
    currentMenu.push({
      phase: "Kick Vol.",
      style: "Choice",
      dist: 50,
      count: 12,
      cycle: calculateCycle(50, 'En1', refSec100),
      intensity: "En1",
      desc: "Kick Descending 1t-4t",
      gear: selectedGears.includes("Board") ? "Board" : "",
      note: "強いキックでの軸の維持"
    });

    currentMenu.push({
      phase: "Pull Vol.",
      style: "Fr",
      dist: 100,
      count: 8,
      cycle: calculateCycle(100, 'En2', refSec100),
      intensity: "En2",
      desc: "Pull High Elbow Keep",
      gear: selectedGears.includes("Paddle") ? "Paddle,Pull Buoy" : "",
      note: "大きなキャッチとフィニッシュ"
    });

    currentMenu.push({
      phase: "Main Set",
      style: "Fr",
      dist: 100,
      count: 8,
      cycle: calculateCycle(100, 'En2', refSec100),
      intensity: "En2",
      desc: "Quality Swim",
      gear: "",
      note: "基礎練習で掴んだ感覚をSwimに繋げる"
    });

  } else {
    // 通常パターン (60〜90分未満 または 単一ボリュームタイプ)
    currentMenu.push({
      phase: "Drill",
      style: "Choice",
      dist: poolLen === 50 ? 50 : 25,
      count: 6,
      cycle: calculateCycle(poolLen === 50 ? 50 : 25, 'A2', refSec100),
      intensity: "A2",
      desc: "Catch-Up / Sculling",
      gear: selectedGears.includes("Snorkel") ? "Snorkel" : "",
      note: "水捉えの感覚意識"
    });

    // 50m×56本などの極端な本数が出ないよう上限キャップ（最大16本）
    let mainCount = Math.min(16, Math.floor((targetMinutes * 60 * 0.4) / calculateCycle(100, 'En2', refSec100)));
    currentMenu.push({
      phase: "Main Set",
      style: "Fr",
      dist: 100,
      count: Math.max(6, mainCount),
      cycle: calculateCycle(100, 'En2', refSec100),
      intensity: "En2",
      desc: "Descending 1t-4t Keep",
      gear: "",
      note: "一定リズムの維持とイーブンペース"
    });
  }

  // 最後に Down
  let downDist = targetMinutes >= 120 ? 400 : 200;
  currentMenu.push({
    phase: "Down",
    style: "Choice",
    dist: downDist,
    count: 1,
    cycle: calculateCycle(downDist, 'A1', refSec100),
    intensity: "A1",
    desc: "Easy Swim / Loosen",
    gear: "",
    note: "疲労物質の除去とクールダウン"
  });

  renderMenu();
}

// --- UI描画 ＆ リアルタイム編集 ---
function renderMenu() {
  const container = document.getElementById("menuContainer");
  container.innerHTML = "";

  let cumulativeSec = 0;

  currentMenu.forEach((item, index) => {
    let phaseSec = getPhaseSeconds(item);
    cumulativeSec += phaseSec;

    const card = document.createElement("div");
    card.className = `phase-card ${item.isSet ? 'is-set' : ''}`;

    if (item.isSet) {
      let subHTML = item.subItems.map((s, subIdx) => `
        <div class="sub-item-line">
          ・ 
          <input type="number" class="edit-num" value="${s.count}" onchange="updateSubItem(${index}, ${subIdx}, 'count', this.value)"> t × 
          <input type="number" class="edit-num" value="${s.dist}" onchange="updateSubItem(${index}, ${subIdx}, 'dist', this.value)"> m | 
          <input type="text" class="edit-text" value="${s.desc}" onchange="updateSubItem(${index}, ${subIdx}, 'desc', this.value)"> | @
          <input type="text" class="edit-cycle" value="${typeof s.cycle === 'number' ? formatTime(s.cycle) : s.cycle}" onchange="updateSubItem(${index}, ${subIdx}, 'cycle', this.value)">
          ${s.gear ? `<span style="color:var(--primary-dark); font-weight:bold;">[${s.gear}]</span>` : ''}
        </div>
      `).join("");

      card.innerHTML = `
        <div class="phase-header">
          <div>
            [<input type="text" class="phase-title-text" value="${item.phase}" onchange="updatePhase(${index}, 'phase', this.value)">]
            <input type="number" class="edit-num" value="${item.sets}" onchange="updatePhase(${index}, 'sets', this.value)"> Set 
            (Set Rest @<input type="number" class="edit-num" value="${item.setRest}" onchange="updatePhase(${index}, 'setRest', this.value)">s)
            <span class="intensity-badge int-${item.intensity || 'En2'}">${item.intensity || 'En2'}</span>
            <span class="timeline-tag">経過: ${formatTime(cumulativeSec)}</span>
          </div>
          <div class="phase-controls no-print">
            <button class="btn btn-sm btn-secondary" onclick="movePhase(${index}, -1)">▲</button>
            <button class="btn btn-sm btn-secondary" onclick="movePhase(${index}, 1)">▼</button>
            <button class="btn btn-sm btn-danger" onclick="deletePhase(${index})">削除</button>
          </div>
        </div>
        ${subHTML}
        <div class="phase-note">💡 Point: <input type="text" class="edit-note" value="${item.note || ''}" onchange="updatePhase(${index}, 'note', this.value)"></div>
      `;
    } else {
      card.innerHTML = `
        <div class="phase-header">
          <div>
            [<input type="text" class="phase-title-text" value="${item.phase}" onchange="updatePhase(${index}, 'phase', this.value)">]
            <span class="intensity-badge int-${item.intensity || 'A1'}">${item.intensity || 'A1'}</span>
            <span class="timeline-tag">経過: ${formatTime(cumulativeSec)}</span>
          </div>
          <div class="phase-controls no-print">
            <button class="btn btn-sm btn-secondary" onclick="movePhase(${index}, -1)">▲</button>
            <button class="btn btn-sm btn-secondary" onclick="movePhase(${index}, 1)">▼</button>
            <button class="btn btn-sm btn-danger" onclick="deletePhase(${index})">削除</button>
          </div>
        </div>
        <div class="phase-main-line">
          <input type="number" class="edit-num" value="${item.count}" onchange="updatePhase(${index}, 'count', this.value)"> t × 
          <input type="number" class="edit-num" value="${item.dist}" onchange="updatePhase(${index}, 'dist', this.value)"> m | 
          <input type="text" class="edit-text" value="${item.desc}" onchange="updatePhase(${index}, 'desc', this.value)"> | @
          <input type="text" class="edit-cycle" value="${typeof item.cycle === 'number' ? formatTime(item.cycle) : item.cycle}" onchange="updatePhase(${index}, 'cycle', this.value)">
          ${item.gear ? `<span style="color:var(--primary-dark); font-size:0.85rem; font-weight:bold;">[${item.gear}]</span>` : ''}
        </div>
        <div class="phase-note">💡 Point: <input type="text" class="edit-note" value="${item.note || ''}" onchange="updatePhase(${index}, 'note', this.value)"></div>
      `;
    }

    container.appendChild(card);
  });

  calculateTotalStats();
}

function updatePhase(index, field, value) {
  currentMenu[index][field] = value;
  renderMenu();
}

function updateSubItem(phaseIdx, subIdx, field, value) {
  currentMenu[phaseIdx].subItems[subIdx][field] = value;
  renderMenu();
}

function movePhase(index, dir) {
  const newIndex = index + dir;
  if (newIndex < 0 || newIndex >= currentMenu.length) return;
  const temp = currentMenu[index];
  currentMenu[index] = currentMenu[newIndex];
  currentMenu[newIndex] = temp;
  renderMenu();
}

function deletePhase(index) {
  currentMenu.splice(index, 1);
  renderMenu();
}

// --- ライブラリ機能 ---
function savePreset() {
  const name = document.getElementById("presetName").value;
  const phase = document.getElementById("presetPhase").value;
  const intensity = document.getElementById("presetIntensity").value;
  const style = document.getElementById("presetStyle").value;
  const detail = document.getElementById("presetDetail").value;
  const gear = Array.from(document.querySelectorAll('.preset-gear-check:checked')).map(cb => cb.value).join(',');

  if (!name || !detail) return alert("メニュー名と詳細を入力してください");

  const presets = JSON.parse(localStorage.getItem("aquaplan_presets_v4") || "[]");
  presets.push({ id: Date.now(), name, phase, intensity, style, detail, gear });
  localStorage.setItem("aquaplan_presets_v4", JSON.stringify(presets));

  document.getElementById("presetName").value = "";
  document.getElementById("presetDetail").value = "";
  loadPresets();
}

function loadPresets() {
  const list = document.getElementById("presetList");
  const query = (document.getElementById("presetSearch")?.value || "").toLowerCase();
  const customPresets = JSON.parse(localStorage.getItem("aquaplan_presets_v4") || "[]");
  
  const allPresets = [...defaultPresets, ...customPresets];
  list.innerHTML = "";

  const filtered = allPresets.filter(p => 
    p.name.toLowerCase().includes(query) || 
    p.phase.toLowerCase().includes(query) || 
    p.intensity.toLowerCase().includes(query) || 
    p.style.toLowerCase().includes(query) || 
    p.detail.toLowerCase().includes(query) ||
    (p.gear && p.gear.toLowerCase().includes(query))
  );

  filtered.forEach(p => {
    const isCustom = typeof p.id === 'number';
    const item = document.createElement("div");
    item.className = "preset-item";
    item.innerHTML = `
      <div>
        <strong>${p.name}</strong> 
        <span class="tag-sm">${p.phase}</span>
        <span class="tag-sm" style="background:#bae6fd;">${p.intensity}</span>
        <span class="tag-sm" style="background:#fef08a;">${p.style}</span>
        ${p.gear ? `<span class="tag-sm" style="background:#ddd6fe;">${p.gear}</span>` : ''}
        <br><small style="color:#64748b;">${p.detail}</small>
      </div>
      <div>
        <button class="btn btn-sm" onclick="addPresetToMenu('${p.id}')">追加</button>
        ${isCustom ? `<button class="btn btn-sm btn-danger" onclick="deletePreset(${p.id})">消去</button>` : ''}
      </div>
    `;
    list.appendChild(item);
  });
}

function addPresetToMenu(id) {
  const customPresets = JSON.parse(localStorage.getItem("aquaplan_presets_v4") || "[]");
  const allPresets = [...defaultPresets, ...customPresets];
  const p = allPresets.find(item => item.id == id);
  if (!p) return;

  const refSec100 = parseRefTimeToSeconds(document.getElementById("refTime").value);

  currentMenu.push({
    phase: p.phase,
    style: p.style,
    dist: 50,
    count: 4,
    cycle: calculateCycle(50, p.intensity, refSec100),
    intensity: p.intensity,
    desc: p.name,
    gear: p.gear,
    note: p.detail
  });
  renderMenu();
}

function deletePreset(id) {
  let presets = JSON.parse(localStorage.getItem("aquaplan_presets_v4") || "[]");
  presets = presets.filter(p => p.id !== id);
  localStorage.setItem("aquaplan_presets_v4", JSON.stringify(presets));
  loadPresets();
}

loadPresets();
generateMenu();
</script>
