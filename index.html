<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AQUAPLAN - SWIM TRAINING SPEC SHEET</title>
  <style>
    :root {
      --primary: #0284c7;
      --text-main: #0f172a;
      --text-sub: #475569;
      --bg-gray: #f8fafc;
      --border-color: #cbd5e1;
    }
    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
      color: var(--text-main);
      margin: 0; padding: 20px;
      background-color: #e2e8f0;
    }
    .container {
      max-width: 950px; margin: 0 auto;
      background: #fff; padding: 30px;
      border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    
    /* コントロールエリア（設定パネル） */
    .control-panel {
      background: var(--bg-gray); border: 1px solid var(--border-color);
      border-radius: 8px; padding: 15px 20px; margin-bottom: 20px;
      display: flex; flex-wrap: wrap; gap: 15px; align-items: center; justify-content: space-between;
    }
    .control-group { display: flex; align-items: center; gap: 10px; }
    .control-group label { font-size: 0.85rem; font-weight: bold; color: var(--text-sub); }
    .control-group select, .control-group input {
      padding: 8px 12px; border: 1px solid var(--border-color);
      border-radius: 6px; font-weight: bold; font-size: 0.95rem; outline: none;
    }
    .btn-generate {
      padding: 10px 20px; background-color: var(--primary); color: #fff;
      font-size: 0.95rem; font-weight: bold; border: none; border-radius: 6px;
      cursor: pointer; transition: background 0.2s;
    }
    .btn-generate:hover { background-color: #0369a1; }

    .header {
      border-bottom: 3px solid var(--primary);
      padding-bottom: 15px; margin-bottom: 20px;
      display: flex; justify-content: space-between; align-items: flex-end;
    }
    .header h1 { margin: 0; color: var(--primary); font-size: 2rem; letter-spacing: 1px; }
    .header-sub { font-size: 0.85rem; font-weight: bold; color: var(--text-sub); }
    
    /* コンセプト表示エリア */
    .concept-box {
      background-color: #f0f9ff; border-left: 4px solid var(--primary);
      padding: 10px 15px; margin-bottom: 20px; font-weight: bold; color: #0369a1;
      font-size: 0.95rem; display: flex; align-items: center; gap: 8px;
    }

    /* テーブルデザイン */
    table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 0.88rem; }
    th, td { border: 1px solid var(--border-color); padding: 10px 12px; vertical-align: top; }
    th { background-color: var(--text-main); color: #fff; font-size: 0.8rem; text-align: left; }
    
    /* バッジ */
    .badge-zone { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; color: #fff; }
    .zone-a1 { background-color: #22c55e; }
    .zone-a2 { background-color: #10b981; }
    .zone-en1 { background-color: #0284c7; }
    .zone-en2 { background-color: #2563eb; }
    .zone-sp1 { background-color: #ef4444; }
    
    .badge-gear { display: inline-block; padding: 2px 6px; background-color: #0284c7; color: #fff; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
    .cycle-badge { display: inline-flex; align-items: center; background-color: #e0f2fe; color: #0f172a; padding: 3px 6px; border-radius: 4px; font-weight: bold; font-family: monospace; font-size: 0.85rem; border: 1px solid #bae6fd; }

    /* 折り返し対応ステルスエディタ */
    .stealth-editor { width: 100%; min-height: 40px; outline: none; white-space: pre-wrap; word-wrap: break-word; color: var(--text-sub); line-height: 1.5; padding: 4px; border-radius: 4px; }
    .stealth-editor:hover { background-color: #f1f5f9; }
    .stealth-editor:focus { background-color: #fff; box-shadow: 0 0 0 2px var(--primary); }

    .menu-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; font-weight: bold; font-size: 1rem; }
    .set-header { border-bottom: 1px dashed var(--border-color); padding-bottom: 4px; margin-bottom: 8px; color: var(--primary); font-weight: bold; font-size: 0.9rem; }
  </style>
</head>
<body>

<div class="container">
  <!-- 🎯 設定コントロールパネル -->
  <div class="control-panel">
    <div class="control-group">
      <label>🎯 練習テーマ (目的):</label>
      <select id="theme-select">
        <option value="AT_CAPACITY">【AT耐性】有酸素キャパシティ・ペース維持</option>
        <option value="LACTIC_TOLERANCE">【耐乳酸】Sp1スプリント & レース後半強化</option>
        <option value="FORM_ENDURANCE">【フォーム & 基礎】En1持続力 & 効率化</option>
      </select>
    </div>

    <div class="control-group">
      <label>⏰ 開始時刻:</label>
      <input type="time" id="start-time" value="10:00">
    </div>

    <button class="btn-generate" onclick="generateMenu()">🔄 メニューを自動生成</button>
  </div>

  <!-- ヘッダー -->
  <div class="header">
    <div>
      <h1>AQUAPLAN</h1>
      <div class="header-sub">SWIM TRAINING SPEC SHEET</div>
    </div>
    <div style="text-align: right; font-size: 0.85rem; font-weight: bold;">
      <div>DATE: <span id="current-date"></span></div>
      <div>POOL: 短水路 (25m)</div>
    </div>
  </div>

  <!-- 今日のコンセプト表示 -->
  <div class="concept-box" id="concept-display">
    🎯 TODAY'S CONCEPT: --
  </div>

  <!-- メニューテーブル -->
  <table>
    <thead>
      <tr>
        <th style="width: 12%; text-align: center;">TIME</th>
        <th style="width: 15%;">PHASE / INTENSITY</th>
        <th style="width: 43%;">MENU DETAILS (COUNT × DIST @ CYCLE)</th>
        <th style="width: 30%;">COACH'S INTENT & INSTRUCTION</th>
      </tr>
    </thead>
    <tbody id="menu-tbody">
      <!-- JSで動的に追加 -->
    </tbody>
  </table>
</div>

<script>
  // 今日の日付セット
  document.getElementById('current-date').innerText = new Date().toLocaleDateString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit' }).replace(/\//g, '.');

  // 💡 目的（テーマ）別のマスターデータ定義
  const THEME_PRESETS = {
    AT_CAPACITY: {
      concept: "TODAY'S CONCEPT: Target Pace Keep & High Elbow Focus",
      phases: [
        { name: "Warm Up", intensity: "A1", dist: 200, vol: 400, cycleSec: 200, gear: "", intent: "関節可動域の確保と段階的な心拍数の向上。" },
        { name: "Drill", intensity: "A2", dist: 50, vol: 400, cycleSec: 60, gear: "Snorkel", intent: "キャッチ位置の確認。ハイエルボーの再現性を高める。" },
        { name: "Kick & Pull", intensity: "En1", dist: 50, vol: 800, cycleSec: 55, gear: "Board", intent: "体幹軸を崩さずに推進力を維持する感覚の習得。" },
        { name: "Main 1", intensity: "En2", dist: 100, vol: 1600, cycleSec: 90, gear: "Paddle", intent: "ATペースでの長距離Hold。本数を重ねてもフォームを崩さない。" },
        { name: "Main 2", intensity: "Sp1", dist: 50, vol: 300, cycleSec: 60, gear: "Fin", intent: "最後に出力を上げてMaxスピードを維持する意識。" },
        { name: "Down", intensity: "A1", dist: 200, vol: 200, cycleSec: 240, gear: "", intent: "心拍数の降下と疲労物質の除去。" }
      ]
    },
    LACTIC_TOLERANCE: {
      concept: "TODAY'S CONCEPT: Max Speed & Lactic Acid Resistance",
      phases: [
        { name: "Warm Up", intensity: "A1", dist: 200, vol: 400, cycleSec: 200, gear: "", intent: "ウォーミングアップと心拍の段階的引き上げ。" },
        { name: "Drill", intensity: "A2", dist: 50, vol: 300, cycleSec: 60, gear: "", intent: "スプリントに向けた素早いテンポの軸確認。" },
        { name: "Kick & Pull", intensity: "En1", dist: 50, vol: 400, cycleSec: 50, gear: "Paddle", intent: "ハイテンポ時にもキャッチを滑らせない意識付け。" },
        { name: "Main 1", intensity: "En2", dist: 100, vol: 800, cycleSec: 90, gear: "", intent: "メインスプリント前の有酸素刺激と心拍確保。" },
        { name: "Main 2", intensity: "Sp1", dist: 50, vol: 600, cycleSec: 75, gear: "Fin", intent: "耐乳酸トレーニング。ラスト15mのキック低下を防ぐ全開泳。" },
        { name: "Down", intensity: "A1", dist: 200, vol: 300, cycleSec: 300, gear: "", intent: "丁寧なリカバリー泳で代謝物を流す。" }
      ]
    },
    FORM_ENDURANCE: {
      concept: "TODAY'S CONCEPT: Distance Per Stroke & Efficiency",
      phases: [
        { name: "Warm Up", intensity: "A1", dist: 200, vol: 400, cycleSec: 210, gear: "", intent: "リラックスしたフォームでストローク長を伸ばす。" },
        { name: "Drill", intensity: "A2", dist: 50, vol: 600, cycleSec: 65, gear: "Snorkel", intent: "片手スイムでの重心移動とロール角の最適化。" },
        { name: "Kick & Pull", intensity: "En1", dist: 100, vol: 800, cycleSec: 110, gear: "Paddle", intent: "少ないストローク数で効率よく進む感覚を掴む。" },
        { name: "Main 1", intensity: "En1", dist: 200, vol: 1200, cycleSec: 210, gear: "", intent: "一定のストローク数をキープして長距離を泳ぎ切る。" },
        { name: "Main 2", intensity: "En2", dist: 50, vol: 400, cycleSec: 55, gear: "", intent: "良好なフォームを維持したまま、少しずつペースアップ。" },
        { name: "Down", intensity: "A1", dist: 200, vol: 200, cycleSec: 240, gear: "", intent: "心拍数を下げてクールダウン。" }
      ]
    }
  };

  function formatTime(totalMinutes) {
    let hrs = Math.floor(totalMinutes / 60) % 24;
    let mins = Math.floor(totalMinutes % 60);
    return `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}`;
  }

  function generateMenu() {
    const themeKey = document.getElementById('theme-select').value;
    const startTimeVal = document.getElementById('start-time').value || "10:00";
    const selectedPreset = THEME_PRESETS[themeKey];

    // コンセプト更新
    document.getElementById('concept-display').innerText = selectedPreset.concept;

    // 開始時刻を分数に変換
    const [startH, startM] = startTimeVal.split(':').map(Number);
    let currentMin = startH * 60 + startM;

    const tbody = document.getElementById('menu-tbody');
    tbody.innerHTML = '';

    selectedPreset.phases.forEach(p => {
      let count = Math.floor(p.vol / p.dist);
      if (count < 1) count = 1;

      let cycleM = Math.floor(p.cycleSec / 60);
      let cycleS = (p.cycleSec % 60).toString().padStart(2, '0');
      let cycleDisplay = `@ ${cycleM}:${cycleS}`;

      let durationSec = 0;
      let menuDetailsHtml = '';

      // 🚨 本数が12本を超える場合は自動セット分割
      if (count > 12) {
        let sets = Math.ceil(count / 8);
        let countPerSet = Math.floor(count / sets);
        let setRest = 45;
        durationSec = (countPerSet * p.cycleSec * sets) + (setRest * (sets - 1));

        menuDetailsHtml = `
          <div class="set-header">${sets} SETS (Rest @ ${setRest}s)</div>
          <div class="menu-row"><span>${countPerSet} t × ${p.dist} m</span></div>
          <div style="margin-bottom:6px;">Fr ${p.name} - Pace Keep</div>
          <div><span class="cycle-badge">${cycleDisplay}</span> ${p.gear ? `<span class="badge-gear">[${p.gear}]</span>` : ''}</div>
        `;
      } else {
        durationSec = count * p.cycleSec;
        menuDetailsHtml = `
          <div class="menu-row"><span>${count} t × ${p.dist} m</span></div>
          <div style="margin-bottom:6px;">Fr ${p.name}</div>
          <div><span class="cycle-badge">${cycleDisplay}</span> ${p.gear ? `<span class="badge-gear">[${p.gear}]</span>` : ''}</div>
        `;
      }

      // 時刻計算
      let endMin = currentMin + (durationSec / 60);
      let timeDisplay = `${formatTime(currentMin)}<br>↓<br>${formatTime(endMin)}`;
      currentMin = endMin; // 次のフェーズの開始時刻へ

      let tr = document.createElement('tr');
      tr.innerHTML = `
        <td style="text-align: center; font-weight: bold; font-family: monospace; color: var(--text-sub);">
          ${timeDisplay}
        </td>
        <td>
          <div style="font-weight: bold; margin-bottom: 6px;">${p.name}</div>
          <span class="badge-zone zone-${p.intensity.toLowerCase()}">${p.intensity}</span>
        </td>
        <td>${menuDetailsHtml}</td>
        <td>
          <div class="stealth-editor" contenteditable="true">💡 ${p.intent}</div>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  // 初回生成
  window.onload = generateMenu;
</script>

</body>
</html>
