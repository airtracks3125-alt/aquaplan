<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AQUAPLAN - 競泳メニュー作成アシスタント</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap');

    :root {
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --primary-light: #e0f2fe;
      --bg: #0f172a;
      --panel-bg: #1e293b;
      --card-bg: #ffffff;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --border: #cbd5e1;
      --accent: #d97706;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', 'Noto Sans JP', sans-serif; }
    body { background-color: var(--bg); color: #f8fafc; line-height: 1.5; padding: 20px; max-width: 1000px; margin: 0 auto; }

    /* Web UI Header */
    .app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid var(--primary); }
    .brand-logo { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.03em; background: linear-gradient(135deg, #38bdf8, #0284c7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .brand-sub { font-size: 0.85rem; color: #94a3b8; font-weight: 500; }

    .panel { background: var(--panel-bg); border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #334155; }
    .panel-title { font-weight: 700; margin-bottom: 14px; color: #38bdf8; font-size: 1.1rem; border-bottom: 1px solid #334155; padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }

    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
    .form-group { margin-bottom: 10px; }
    label { display: block; font-size: 0.8rem; font-weight: 600; color: #cbd5e1; margin-bottom: 5px; }
    input, select { width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid #475569; font-size: 0.9rem; background-color: #0f172a; color: #f8fafc; outline: none; transition: all 0.2s; }
    input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.25); }

    .checkbox-group { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
    .checkbox-item { display: flex; align-items: center; gap: 5px; font-size: 0.85rem; cursor: pointer; color: #e2e8f0; }
    .checkbox-item input { width: auto; cursor: pointer; }

    .btn { background: var(--primary); color: white; border: none; font-weight: 700; cursor: pointer; transition: all 0.2s; padding: 10px 16px; border-radius: 8px; }
    .btn:hover { background: var(--primary-dark); }
    .btn-secondary { background: #475569; color: white; }
    .btn-secondary:hover { background: #334155; }
    .btn-danger { background: #ef4444; color: white; }
    .btn-danger:hover { background: #dc2626; }
    .btn-action { background: linear-gradient(135deg, #0284c7, #2563eb); font-size: 1rem; width: 100%; padding: 12px; }

    /* 📄 SWIM SHEET AREA (A4 Container) */
    .swim-sheet-wrapper { background: var(--card-bg); color: var(--text-dark); border-radius: 12px; padding: 30px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); margin-top: 10px; }
    
    .sheet-header { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 3px solid var(--text-dark); padding-bottom: 12px; margin-bottom: 16px; }
    .sheet-title-group h1 { font-size: 2.2rem; font-weight: 900; letter-spacing: -0.04em; color: #0284c7; line-height: 1; }
    .sheet-title-group p { font-size: 0.85rem; font-weight: 700; color: #475569; letter-spacing: 0.1em; text-transform: uppercase; margin-top: 4px; }
    .sheet-meta { text-align: right; font-size: 0.85rem; font-weight: 600; color: #334155; }

    .sheet-concept-box { background: #f1f5f9; border-left: 5px solid var(--primary); padding: 10px 14px; margin-bottom: 18px; border-radius: 0 6px 6px 0; font-size: 0.95rem; font-weight: 700; color: #1e293b; display: flex; align-items: center; gap: 8px; }

    /* Summary Bar */
    .stats-bar { display: flex; gap: 12px; justify-content: space-between; background: #f8fafc; padding: 12px 18px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 18px; }
    .stat-item { font-size: 0.95rem; font-weight: 700; color: #0f172a; }
    .stat-value { color: var(--primary-dark); font-size: 1.1rem; }

    /* Phase Cards in Sheet */
    .phase-card { background: #fff; border: 1px solid var(--border); border-left: 6px solid var(--primary); padding: 12px 14px; margin-bottom: 10px; border-radius: 6px; position: relative; }
    .phase-header { display: flex; justify-content: space-between; align-items: center; font-weight: 700; margin-bottom: 6px; border-bottom: 1px dashed #e2e8f0; padding-bottom: 4px; }
    .phase-time-slot { font-size: 0.85rem; background: #0f172a; color: #fff; padding: 2px 8px; border-radius: 4px; font-weight: 700; margin-right: 6px; }
    .phase-title-text { font-size: 1rem; font-weight: 800; color: #0f172a; border: none; background: transparent; width: 180px; }
    
    .phase-main-line { font-size: 0.98rem; font-weight: 600; color: #0f172a; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .phase-note { font-size: 0.82rem; color: #475569; margin-top: 6px; font-style: italic; display: flex; align-items: center; gap: 4px; }

    .intensity-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 800; color: #fff; background: #64748b; margin-left: 6px; }
    .int-A1, .int-A2 { background: #10b981; }
    .int-En1, .int-En2 { background: #0284c7; }
    .int-En3 { background: #f59e0b; }
    .int-Sp1, .int-Sp2, .int-Sp3 { background: #ef4444; }

    .sub-item-line { margin-left: 10px; padding: 4px 0; border-bottom: 1px solid #f1f5f9; font-size: 0.95rem; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }

    /* Inline Inputs */
    .edit-num { width: 50px !important; text-align: center; font-weight: 700; padding: 2px 4px !important; background: #fff !important; color: #000 !important; border: 1px solid #cbd5e1 !important; }
    .edit-text { width: 220px !important; padding: 2px 6px !important; background: #fff !important; color: #000 !important; border: 1px solid #cbd5e1 !important; }
    .edit-cycle { width: 65px !important; text-align: center; padding: 2px 4px !important; background: #fff !important; color: #000 !important; border: 1px solid #cbd5e1 !important; }
    .edit-note { width: 100% !important; padding: 2px 6px !important; font-size: 0.82rem; background: #fff !important; color: #000 !important; border: 1px solid #e2e8f0 !important; }
    .edit-style { width: 80px !important; padding: 2px 4px !important; font-weight: 700; background: #fff !important; color: #000 !important; border: 1px solid #cbd5e1 !important; }

    /* Preset List */
    .preset-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-bottom: 1px solid #334155; font-size: 0.85rem; }
    .tag-sm { font-size: 0.7rem; background: #334155; color: #38bdf8; padding: 2px 6px; border-radius: 4px; margin-right: 4px; font-weight: 600; }

    /* 👁 プレビューモード（編集パネルを隠してA4用紙を全面表示） */
    body.preview-mode .no-print, body.preview-mode .panel { display: none !important; }
    body.preview-mode body { background: #fff; padding: 0; }
    body.preview-mode .swim-sheet-wrapper { box-shadow: none; padding: 0; margin: 0; }

    /* 🖨 印刷用 (A4レイアウト最適化) */
    @media print {
      body { background: white !important; padding: 0 !important; color: #000 !important; }
      .no-print, .panel, .app-header { display: none !important; }
      .swim-sheet-wrapper { box-shadow: none !important; padding: 0 !important; border: none !important; }
      .phase-card { page-break-inside: avoid; border: 1px solid #94a3b8; margin-bottom: 8px; padding: 8px 10px; background: #fff !important; }
      input, select { border: none !important; background: transparent !important; padding: 0 !important; width: auto !important; font-weight: bold !important; color: #000 !important; }
      .edit-text, .edit-note { width: auto !important; }
      .phase-controls { display: none !important; }
    }
  </style>
</head>
<body>

<header class="app-header no-print">
  <div>
    <div class="brand-logo">AQUAPLAN</div>
    <div class="brand-sub">競泳メニュー作成アシスタント & SWIM SHEET プロデューサー</div>
  </div>
  <div style="display:flex; gap:10px;">
    <button class="btn btn-secondary" onclick="togglePreviewMode()">👁 SWIM SHEET プレビュー切替</button>
    <button class="btn" onclick="window.print()">🖨 印刷 / PDF保存</button>
  </div>
</header>

<!-- 1. パラメータ設定 -->
<div class="panel no-print">
  <div class="panel-title">1. コンディション & パラメータ設定</div>
  <div class="grid-3">
    <div class="form-group">
      <label>目標時間 (15分〜180分)</label>
      <input type="number" id="targetTime" value="90" min="15" max="180" step="5" onchange="generateMenu()">
    </div>
    <div class="form-group">
      <label>練習開始予定時刻</label>
      <input type="time" id="startTime" value="10:00" onchange="renderMenu()">
    </div>
    <div class="form-group">
      <label>水路長 (プール)</label>
      <select id="poolLength" onchange="generateMenu()">
        <option value="25">短水路 (25m)</option>
        <option value="50">長水路 (50m)</option>
      </select>
    </div>
  </div>

  <div class="grid-3">
    <div class="form-group">
      <label>フォーカス種目 (メイン/ドリル基準)</label>
      <select id="focusStyle" onchange="generateMenu()">
        <option value="Fr" selected>Fr (自由形)</option>
        <option value="Ba">Ba (背泳ぎ)</option>
        <option value="Br">Br (平泳ぎ)</option>
        <option value="Fly">Fly (バタフライ)</option>
        <option value="IM">IM (個人メドレー)</option>
        <option value="S1">S1 (専門種目)</option>
        <option value="Choice">Choice (無指定/選択)</option>
      </select>
    </div>
    <div class="form-group">
      <label>メインフォーカス内容</label>
      <select id="focusType" onchange="generateMenu()">
        <option value="Aerobic">Aerobic (持久力・ベース)</option>
        <option value="Speed">Speed (耐乳酸・スプリント)</option>
        <option value="Technique">Technique (フォーム・ドリル)</option>
      </select>
    </div>
    <div class="form-group">
      <label>100m参考タイム (分:秒)</label>
      <input type="text" id="refTime" value="1:05.0" placeholder="例: 1:05.0" onchange="generateMenu()">
    </div>
  </div>

  <div class="grid-2">
    <div class="form-group">
      <label>本日のコンセプト / テーマ (シート見出し)</label>
      <input type="text" id="todayConcept" value="Multi-Phase Aerobic & Sprint Conditioning" oninput="updateConcept(this.value)">
    </div>
    <div class="form-group">
      <label>使用可能ツール</label>
      <div class="checkbox-group">
        <label class="checkbox-item"><input type="checkbox" class="gear-check" value="Fin" checked onchange="generateMenu()"> Fin</label>
        <label class="checkbox-item"><input type="checkbox" class="gear-check" value="Paddle" checked onchange="generateMenu()"> Paddle</label>
        <label class="checkbox-item"><input type="checkbox" class="gear-check" value="Snorkel" checked onchange="generateMenu()"> Snorkel</label>
        <label class="checkbox-item"><input type="checkbox" class="gear-check" value="Pull Buoy" checked onchange="generateMenu()"> Pull</label>
        <label class="checkbox-item"><input type="checkbox" class="gear-check" value="Board" checked onchange="generateMenu()"> Board</label>
      </div>
    </div>
  </div>

  <button class="btn btn-action" onclick="generateMenu()" style="margin-top:8px;">メニューを自動生成する</button>
</div>

<!-- 2. プリセットライブラリ -->
<div class="panel no-print">
  <div class="panel-title">2. プリセットライブラリ (種目別ドリル・メニュー標準搭載)</div>
  <div class="grid-3">
    <input type="text" id="presetName" placeholder="メニュー名 (例: 1-Arm Catch Drill)">
    <select id="presetPhase">
      <option value="Warm Up">Warm Up</option>
      <option value="Drill" selected>Drill</option>
      <option value="Kick">Kick</option>
      <option value="Pull">Pull</option>
      <option value="Main">Main</option>
      <option value="Down">Down</option>
    </select>
    <select id="presetIntensity">
      <option value="A1">A1 (Rest/Easy)</option>
      <option value="A2">A2 (Technique/Form)</option>
      <option value="En1">En1 (Base Pace)</option>
      <option value="En2">En2 (AT Pace)</option>
      <option value="En3">En3 (VO2max)</option>
      <option value="Sp1">Sp1 (Tolerance)</option>
      <option value="Sp2">Sp2 (Max Speed)</option>
    </select>
  </div>
  <div class="grid-2" style="margin-top:8px;">
    <select id="presetStyle">
      <option value="Fr">Fr</option>
      <option value="Ba">Ba</option>
      <option value="Br">Br</option>
      <option value="Fly">Fly</option>
      <option value="IM">IM</option>
      <option value="S1">S1</option>
      <option value="Choice" selected>Choice</option>
    </select>
    <input type="text" id="presetDetail" placeholder="ワンポイント解説・意識事項">
  </div>
  
  <button class="btn btn-secondary" onclick="savePreset()" style="margin-top:10px; padding:6px 12px; font-size:0.85rem;">オリジナルメニューとしてライブラリへ追加</button>

  <div style="margin-top:12px; border-top:1px dashed #334155; padding-top:10px;">
    <input type="text" id="presetSearch" placeholder="種目・キーワードでライブラリ検索 (例: Fly, Kick, スカル)..." oninput="loadPresets()">
  </div>
  <div id="presetList" style="margin-top:8px; max-height:160px; overflow-y:auto;"></div>
</div>

<!-- 📄 3. SWIM SHEET (A4完成シート表示エリア) -->
<div class="swim-sheet-wrapper">
  <div class="sheet-header">
    <div class="sheet-title-group">
      <h1>AQUAPLAN</h1>
      <p>SWIM TRAINING SHEET</p>
    </div>
    <div class="sheet-meta">
      <div id="sheetDateDisplay">DATE: 2026.07.28</div>
      <div id="sheetPoolDisplay">POOL: 短水路 (25m)</div>
    </div>
  </div>

  <div class="sheet-concept-box">
    <span>📌 TODAY'S CONCEPT:</span>
    <span id="conceptTextDisplay">Multi-Phase Aerobic & Sprint Conditioning</span>
  </div>

  <div class="stats-bar">
    <div class="stat-item">総距離: <span class="stat-value" id="totalDistanceBadge">0 m</span></div>
    <div class="stat-item">予定所要時間: <span class="stat-value" id="totalTimeBadge">約 0 分</span></div>
    <div class="stat-item">終了予定: <span class="stat-value" id="endTimeBadge">11:00</span></div>
  </div>

  <div id="menuContainer">
    <!-- メニューが動的に描画されます -->
  </div>

  <div class="no-print" style="margin-top:15px; display:flex; gap:10px;">
    <button class="btn btn-secondary" onclick="addBlankPhase()">+ 自由行を追加</button>
  </div>
</div>

<script>
// --- 種目別ドリル＆実践プリセットライブラリ ---
const defaultPresets = [
  { id: 'd-wu1', name: "SKPS (認知ウォームアップ)", phase: "Warm Up", intensity: "A1", style: "Choice", detail: "Swim / Kick / Pull / Swim 順に体温と心拍を調整", baseDist: 400, baseCount: 1 },
  { id: 'd-dr-fr1', name: "1-Arm Swim Drill (片手スイム)", phase: "Drill", intensity: "A2", style: "Fr", detail: "体幹軸の固定と逆腕エントリー後の伸ばし意識", baseDist: 25, baseCount: 8 },
  { id: 'd-dr-fr2', name: "Catch-Up Drill", phase: "Drill", intensity: "A2", style: "Fr", detail: "前方に手がある状態でのキャッチのタメと伸び", baseDist: 25, baseCount: 6 },
  { id: 'd-dr-ba1', name: "L-Position Roll Drill", phase: "Drill", intensity: "A2", style: "Ba", detail: "肩のローリング動作と頭部の位置固定", baseDist: 25, baseCount: 6 },
  { id: 'd-dr-br1', name: "2-Kick 1-Pull Drill", phase: "Drill", intensity: "A2", style: "Br", detail: "足引きでの抵抗軽減とストライドの最大化", baseDist: 25, baseCount: 8 },
  { id: 'd-dr-fl1', name: "1-1-2 Fly Drill (左右・両手)", phase: "Drill", intensity: "A2", style: "Fly", detail: "第1/第2キックのタイミングと呼吸動作の低さ", baseDist: 25, baseCount: 8 },
  { id: 'd-m1', name: "AT Pace Descending", phase: "Main 1", intensity: "En2", style: "Fr", detail: "心肺機能の強化とAT心拍維持", baseDist: 100, baseCount: 6 },
  { id: 'd-m2', name: "S1 Race Pace Set", phase: "Main 2", intensity: "Sp1", style: "S1", detail: "目標レース前半/後半のターゲットタイム維持", baseDist: 50, baseCount: 8 },
  { id: 'd-m3', name: "All-Out Max Sprint", phase: "Main 3", intensity: "Sp2", style: "Choice", detail: "完全ハード・最高泳速の出力と維持", baseDist: 25, baseCount: 8 }
];

let currentMenu = [];

function parseRefTimeToSeconds(str) {
  if (!str) return 65;
  const parts = str.split(':');
  if (parts.length === 2) return (parseFloat(parts[0]) * 60) + parseFloat(parts[1]);
  return parseFloat(str) || 65;
}

function parseCycleToSeconds(str) {
  if (!str) return 60;
  if (typeof str === 'number') return str;
  const s = String(str).replace('@', '').trim();
  const parts = s.split(':');
  if (parts.length === 2) return (parseInt(parts[0]) * 60) + parseInt(parts[1]);
  return parseInt(s) || 60;
}

function roundTo5Sec(sec) {
  return Math.ceil(sec / 5) * 5;
}

function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.round(sec % 60);
  return `${m}:${s < 10 ? '0' : ''}${s}`;
}

function formatClockTime(startMinutes, elapsedSeconds) {
  let totalMin = startMinutes + Math.floor(elapsedSeconds / 60);
  let h = Math.floor(totalMin / 60) % 24;
  let m = totalMin % 60;
  return `${h < 10 ? '0' : ''}${h}:${m < 10 ? '0' : ''}${m}`;
}

function calculateCycle(dist, intensity, refSec100) {
  let basePace = (refSec100 / 100) * dist;
  let addSec = 0;
  switch(intensity) {
    case 'A1': case 'A2': addSec = dist * 0.35; break;
    case 'En1': addSec = dist * 0.22; break;
    case 'En2': addSec = dist * 0.15; break;
    case 'En3': addSec = dist * 0.25; break;
    case 'Sp1': case 'Sp2': addSec = dist * 0.50; break;
    default: addSec = dist * 0.20;
  }
  return Math.max(30, roundTo5Sec(basePace + addSec));
}

function getPhaseSeconds(item) {
  if (item.isSet) {
    let subSec = 0;
    item.subItems.forEach(s => {
      const cSec = parseCycleToSeconds(s.cycle);
      subSec += (parseInt(s.count) || 1) * cSec;
    });
    return (subSec * (parseInt(item.sets) || 1)) + (((parseInt(item.sets) || 1) - 1) * (parseInt(item.setRest) || 0));
  }
  const cSec = parseCycleToSeconds(item.cycle);
  return (parseInt(item.count) || 1) * cSec;
}

function updateConcept(val) {
  document.getElementById("conceptTextDisplay").innerText = val || "General Practice";
}

function togglePreviewMode() {
  document.body.classList.toggle("preview-mode");
}

// --- ✨【アルゴリズム再構築】フェーズ多段化型 メニュー自動生成エンジン ---
function generateMenu() {
  const targetMinutes = parseInt(document.getElementById("targetTime").value) || 60;
  const poolLen = parseInt(document.getElementById("poolLength").value) || 25;
  const refSec100 = parseRefTimeToSeconds(document.getElementById("refTime").value);
  const focusStyle = document.getElementById("focusStyle").value;
  const focusType = document.getElementById("focusType").value;
  const selectedGears = Array.from(document.querySelectorAll('.gear-check:checked')).map(cb => cb.value);

  currentMenu = [];

  // 1. Warm Up (セッション長に応じた最適化)
  let wuDist = targetMinutes >= 120 ? 600 : (targetMinutes >= 60 ? 400 : (targetMinutes >= 30 ? 200 : 100));
  currentMenu.push({
    phase: "Warm Up",
    style: "Choice",
    dist: wuDist,
    count: 1,
    cycle: calculateCycle(wuDist, 'A1', refSec100),
    intensity: "A1",
    desc: "SKPS Choice Warm Up",
    gear: "",
    note: "心拍数の漸増と動的関節可動域の確保"
  });

  if (targetMinutes < 30) {
    // 15分〜25分: 超高密度単一スプリント
    let sDist = poolLen === 50 ? 50 : 25;
    let mainCount = Math.max(4, Math.floor((targetMinutes * 60 - 300) / calculateCycle(sDist, 'Sp2', refSec100)));
    currentMenu.push({
      phase: "Main Sprint",
      style: focusStyle,
      dist: sDist,
      count: mainCount,
      cycle: calculateCycle(sDist, 'Sp2', refSec100),
      intensity: "Sp2",
      desc: "High Density Max Sprint",
      gear: selectedGears.includes("Fin") ? "Fin" : "",
      note: "短時間高出力・フォーム維持意識"
    });
  } else {
    // 30分以上: 基礎フェーズ（Drill/Kick/Pull）＋ 目標時間に応じた多段メインフェーズ展開！
    
    // Phase 2: Drill
    let drillDist = poolLen === 50 ? 50 : 25;
    currentMenu.push({
      phase: "Drill & Form",
      style: focusStyle,
      dist: drillDist,
      count: targetMinutes >= 90 ? 8 : 4,
      cycle: calculateCycle(drillDist, 'A2', refSec100),
      intensity: "A2",
      desc: `${focusStyle} Specialty Drill Set`,
      gear: selectedGears.includes("Snorkel") ? "Snorkel" : "",
      note: "水捉え（キャッチ）のタメとキャッチインの正確性確認"
    });

    // Phase 3: Kick & Pull (基礎アクティベーション)
    currentMenu.push({
      phase: "Kick & Pull",
      isSet: true,
      sets: targetMinutes >= 120 ? 2 : 1,
      setRest: 30,
      intensity: "En1",
      note: "下半身のキック軸と上半身ハイエルボーの連動",
      subItems: [
        { dist: 50, count: 4, cycle: calculateCycle(50, 'En1', refSec100), desc: `${focusStyle} Kick Build-Up`, gear: selectedGears.includes("Board") ? "Board" : "" },
        { dist: 50, count: 4, cycle: calculateCycle(50, 'En1', refSec100), desc: `${focusStyle} Pull High-Elbow`, gear: selectedGears.includes("Paddle") ? "Paddle" : "" }
      ]
    });

    // 🎯 残り時間を計算し、複数のメインフェーズ（Main 1, Main 2, Main 3, Main 4）を組み立て
    let usedTimeSec = currentMenu.reduce((acc, item) => acc + getPhaseSeconds(item), 0);
    let downTimeSec = 300; // Down用5分
    let mainSecBudget = (targetMinutes * 60) - usedTimeSec - downTimeSec;

    if (mainSecBudget > 0) {
      // セッション長に応じてメインフェーズ数を決定 (60分未満:1〜2 / 60〜89分:2 / 90〜119分:3 / 120分以上:4)
      let mainPhaseCount = 1;
      if (targetMinutes >= 120) mainPhaseCount = 4;
      else if (targetMinutes >= 90) mainPhaseCount = 3;
      else if (targetMinutes >= 55) mainPhaseCount = 2;

      let timePerPhase = mainSecBudget / mainPhaseCount;

      // 1. Main 1: Aerobic & Pace Keep
      if (mainPhaseCount >= 1) {
        let dist1 = 100;
        let c1 = calculateCycle(dist1, 'En2', refSec100);
        let count1 = Math.max(3, Math.floor(timePerPhase / c1));
        currentMenu.push({
          phase: "Main 1 (Pace Keep)",
          style: focusStyle,
          dist: dist1,
          count: count1,
          cycle: c1,
          intensity: "En2",
          desc: "Base Aerobic Pace Descending",
          gear: "",
          note: "心拍AT領域の維持と一定のストローク長キープ"
        });
      }

      // 2. Main 2: Threshold / Short Rest
      if (mainPhaseCount >= 2) {
        let dist2 = 50;
        let c2 = calculateCycle(dist2, 'En3', refSec100);
        let count2 = Math.max(4, Math.floor(timePerPhase / c2));
        currentMenu.push({
          phase: "Main 2 (Threshold)",
          style: focusStyle,
          dist: dist2,
          count: count2,
          cycle: c2,
          intensity: "En3",
          desc: "Short Rest Threshold Set",
          gear: selectedGears.includes("Paddle") ? "Paddle" : "",
          note: "高負荷下でのピッチ向上と耐乳酸能力の引き上げ"
        });
      }

      // 3. Main 3: Race Pace / Sprint
      if (mainPhaseCount >= 3) {
        let dist3 = 50;
        let c3 = calculateCycle(dist3, 'Sp1', refSec100);
        let count3 = Math.max(4, Math.floor(timePerPhase / c3));
        currentMenu.push({
          phase: "Main 3 (Race Pace)",
          style: focusStyle,
          dist: dist3,
          count: count3,
          cycle: c3,
          intensity: "Sp1",
          desc: "Target Race Pace Keep",
          gear: selectedGears.includes("Fin") ? "Fin" : "",
          note: "レース前半/後半の目標ラップタイムを厳密に意識"
        });
      }

      // 4. Main 4: All-Out / Broken Sprint (120分以上の超長大セッション用)
      if (mainPhaseCount >= 4) {
        let dist4 = 25;
        let c4 = calculateCycle(dist4, 'Sp2', refSec100);
        let count4 = Math.max(6, Math.floor(timePerPhase / c4));
        currentMenu.push({
          phase: "Main 4 (Broken Sprint)",
          style: focusStyle,
          dist: dist4,
          count: count4,
          cycle: c4,
          intensity: "Sp2",
          desc: "Max Speed All-Out Set",
          gear: selectedGears.includes("Fin") ? "Fin" : "",
          note: "極度の疲労状態における最大スピードの出力訓練"
        });
      }
    }
  }

  // 最後に Down
  let downDist = targetMinutes >= 120 ? 300 : (targetMinutes >= 60 ? 200 : 100);
  currentMenu.push({
    phase: "Down",
    style: "Choice",
    dist: downDist,
    count: 1,
    cycle: calculateCycle(downDist, 'A1', refSec100),
    intensity: "A1",
    desc: "Easy Swim / Cooldown",
    gear: "",
    note: "心拍数の着実な降下とアクティブリカバリー"
  });

  renderMenu();
}

// --- UI描画 ＆ タイムライン・タイムスケジュール計算 ---
function renderMenu() {
  const container = document.getElementById("menuContainer");
  container.innerHTML = "";

  const startTimeStr = document.getElementById("startTime").value || "10:00";
  const startParts = startTimeStr.split(':');
  const startMin = (parseInt(startParts[0]) * 60) + parseInt(startParts[1]);

  let cumulativeSec = 0;
  let totalDist = 0;

  currentMenu.forEach((item, index) => {
    let phaseSec = getPhaseSeconds(item);
    let phaseStartClock = formatClockTime(startMin, cumulativeSec);
    cumulativeSec += phaseSec;
    let phaseEndClock = formatClockTime(startMin, cumulativeSec);

    if (item.isSet) {
      let subDist = 0;
      item.subItems.forEach(s => subDist += (parseInt(s.dist) || 0) * (parseInt(s.count) || 0));
      totalDist += subDist * (parseInt(item.sets) || 1);
    } else {
      totalDist += (parseInt(item.dist) || 0) * (parseInt(item.count) || 0);
    }

    const card = document.createElement("div");
    card.className = "phase-card";

    if (item.isSet) {
      let subHTML = item.subItems.map((s, subIdx) => `
        <div class="sub-item-line">
          ・ 
          <input type="number" class="edit-num" value="${s.count}" onblur="updateSubItem(${index}, ${subIdx}, 'count', this.value)"> t × 
          <input type="number" class="edit-num" value="${s.dist}" onblur="updateSubItem(${index}, ${subIdx}, 'dist', this.value)"> m | 
          <input type="text" class="edit-text" value="${s.desc}" onblur="updateSubItem(${index}, ${subIdx}, 'desc', this.value)"> | @
          <input type="text" class="edit-cycle" value="${typeof s.cycle === 'number' ? formatTime(s.cycle) : s.cycle}" onblur="updateSubItem(${index}, ${subIdx}, 'cycle', this.value)">
          ${s.gear ? `<span style="color:var(--primary-dark); font-weight:bold; font-size:0.85rem;">[${s.gear}]</span>` : ''}
        </div>
      `).join("");

      card.innerHTML = `
        <div class="phase-header">
          <div>
            <span class="phase-time-slot">${phaseStartClock} - ${phaseEndClock}</span>
            [<input type="text" class="phase-title-text" value="${item.phase}" onblur="updatePhase(${index}, 'phase', this.value)">]
            <input type="number" class="edit-num" value="${item.sets}" onblur="updatePhase(${index}, 'sets', this.value)"> Set 
            (Rest @<input type="number" class="edit-num" value="${item.setRest}" onblur="updatePhase(${index}, 'setRest', this.value)">s)
            <span class="intensity-badge int-${item.intensity || 'En2'}">${item.intensity || 'En2'}</span>
          </div>
          <div class="phase-controls no-print">
            <button class="btn btn-sm btn-secondary" onclick="movePhase(${index}, -1)">▲</button>
            <button class="btn btn-sm btn-secondary" onclick="movePhase(${index}, 1)">▼</button>
            <button class="btn btn-sm btn-danger" onclick="deletePhase(${index})">削除</button>
          </div>
        </div>
        ${subHTML}
        <div class="phase-note">💡 Point: <input type="text" class="edit-note" value="${item.note || ''}" onblur="updatePhase(${index}, 'note', this.value)"></div>
      `;
    } else {
      card.innerHTML = `
        <div class="phase-header">
          <div>
            <span class="phase-time-slot">${phaseStartClock} - ${phaseEndClock}</span>
            [<input type="text" class="phase-title-text" value="${item.phase}" onblur="updatePhase(${index}, 'phase', this.value)">]
            <select class="edit-style" onchange="updatePhase(${index}, 'style', this.value)">
              <option value="Fr" ${item.style === 'Fr' ? 'selected' : ''}>Fr</option>
              <option value="Ba" ${item.style === 'Ba' ? 'selected' : ''}>Ba</option>
              <option value="Br" ${item.style === 'Br' ? 'selected' : ''}>Br</option>
              <option value="Fly" ${item.style === 'Fly' ? 'selected' : ''}>Fly</option>
              <option value="IM" ${item.style === 'IM' ? 'selected' : ''}>IM</option>
              <option value="S1" ${item.style === 'S1' ? 'selected' : ''}>S1</option>
              <option value="Choice" ${item.style === 'Choice' ? 'selected' : ''}>Choice</option>
            </select>
            <span class="intensity-badge int-${item.intensity || 'A1'}">${item.intensity || 'A1'}</span>
          </div>
          <div class="phase-controls no-print">
            <button class="btn btn-sm btn-secondary" onclick="movePhase(${index}, -1)">▲</button>
            <button class="btn btn-sm btn-secondary" onclick="movePhase(${index}, 1)">▼</button>
            <button class="btn btn-sm btn-danger" onclick="deletePhase(${index})">削除</button>
          </div>
        </div>
        <div class="phase-main-line">
          <input type="number" class="edit-num" value="${item.count}" onblur="updatePhase(${index}, 'count', this.value)"> t × 
          <input type="number" class="edit-num" value="${item.dist}" onblur="updatePhase(${index}, 'dist', this.value)"> m | 
          <input type="text" class="edit-text" value="${item.desc}" onblur="updatePhase(${index}, 'desc', this.value)"> | @
          <input type="text" class="edit-cycle" value="${typeof item.cycle === 'number' ? formatTime(item.cycle) : item.cycle}" onblur="updatePhase(${index}, 'cycle', this.value)">
          ${item.gear ? `<span style="color:var(--primary-dark); font-size:0.85rem; font-weight:bold;">[${item.gear}]</span>` : ''}
        </div>
        <div class="phase-note">💡 Point: <input type="text" class="edit-note" value="${item.note || ''}" onblur="updatePhase(${index}, 'note', this.value)"></div>
      `;
    }

    container.appendChild(card);
  });

  // まとめ表示更新
  document.getElementById("totalDistanceBadge").innerText = `${totalDist.toLocaleString()} m`;
  document.getElementById("totalTimeBadge").innerText = `約 ${Math.floor(cumulativeSec / 60)} 分`;
  document.getElementById("endTimeBadge").innerText = formatClockTime(startMin, cumulativeSec);
  
  // 日付・プール情報更新
  const today = new Date();
  document.getElementById("sheetDateDisplay").innerText = `DATE: ${today.getFullYear()}.${today.getMonth()+1}.${today.getDate()}`;
  const poolVal = document.getElementById("poolLength").value;
  document.getElementById("sheetPoolDisplay").innerText = `POOL: ${poolVal == 25 ? '短水路 (25m)' : '長水路 (50m)'}`;
}

function updatePhase(index, field, value) {
  currentMenu[index][field] = value;
  renderMenu();
}

function updateSubItem(phaseIdx, subIdx, field, value) {
  currentMenu[phaseIdx].subItems[subIdx][field] = value;
  renderMenu();
}

function movePhase(index, dir) {
  const newIndex = index + dir;
  if (newIndex < 0 || newIndex >= currentMenu.length) return;
  const temp = currentMenu[index];
  currentMenu[index] = currentMenu[newIndex];
  currentMenu[newIndex] = temp;
  renderMenu();
}

function deletePhase(index) {
  currentMenu.splice(index, 1);
  renderMenu();
}

function addBlankPhase() {
  const refSec100 = parseRefTimeToSeconds(document.getElementById("refTime").value);
  currentMenu.push({
    phase: "Extra Phase",
    style: "Choice",
    dist: 50,
    count: 4,
    cycle: calculateCycle(50, 'En1', refSec100),
    intensity: "En1",
    desc: "Custom Training Line",
    gear: "",
    note: "自由記述・追加メニュー"
  });
  renderMenu();
}

// --- ライブラリ機能 ---
function savePreset() {
  const name = document.getElementById("presetName").value;
  const phase = document.getElementById("presetPhase").value;
  const intensity = document.getElementById("presetIntensity").value;
  const style = document.getElementById("presetStyle").value;
  const detail = document.getElementById("presetDetail").value;

  if (!name || !detail) return alert("メニュー名と詳細を入力してください");

  const presets = JSON.parse(localStorage.getItem("aquaplan_presets_v6") || "[]");
  presets.push({ id: Date.now(), name, phase, intensity, style, detail, baseDist: 50, baseCount: 4 });
  localStorage.setItem("aquaplan_presets_v6", JSON.stringify(presets));

  document.getElementById("presetName").value = "";
  document.getElementById("presetDetail").value = "";
  loadPresets();
}

function loadPresets() {
  const list = document.getElementById("presetList");
  const query = (document.getElementById("presetSearch")?.value || "").toLowerCase();
  const customPresets = JSON.parse(localStorage.getItem("aquaplan_presets_v6") || "[]");
  
  const allPresets = [...defaultPresets, ...customPresets];
  list.innerHTML = "";

  const filtered = allPresets.filter(p => 
    p.name.toLowerCase().includes(query) || 
    p.phase.toLowerCase().includes(query) || 
    p.style.toLowerCase().includes(query) || 
    p.detail.toLowerCase().includes(query)
  );

  filtered.forEach(p => {
    const isCustom = typeof p.id === 'number';
    const item = document.createElement("div");
    item.className = "preset-item";
    item.innerHTML = `
      <div>
        <strong>${p.name}</strong> 
        <span class="tag-sm">${p.phase}</span>
        <span class="tag-sm" style="background:#0284c7; color:#fff;">${p.intensity}</span>
        <span class="tag-sm" style="background:#eab308; color:#000;">${p.style}</span>
        <br><small style="color:#94a3b8;">${p.detail}</small>
      </div>
      <div>
        <button class="btn btn-sm" style="padding:3px 8px; font-size:0.75rem;" onclick="addPresetToMenu('${p.id}')">追加</button>
        ${isCustom ? `<button class="btn btn-sm btn-danger" style="padding:3px 8px; font-size:0.75rem;" onclick="deletePreset(${p.id})">削除</button>` : ''}
      </div>
    `;
    list.appendChild(item);
  });
}

function addPresetToMenu(id) {
  const customPresets = JSON.parse(localStorage.getItem("aquaplan_presets_v6") || "[]");
  const allPresets = [...defaultPresets, ...customPresets];
  const p = allPresets.find(item => item.id == id);
  if (!p) return;

  const refSec100 = parseRefTimeToSeconds(document.getElementById("refTime").value);

  currentMenu.push({
    phase: p.phase,
    style: p.style,
    dist: p.baseDist || 50,
    count: p.baseCount || 4,
    cycle: calculateCycle(p.baseDist || 50, p.intensity, refSec100),
    intensity: p.intensity,
    desc: p.name,
    gear: "",
    note: p.detail
  });
  renderMenu();
}

function deletePreset(id) {
  let presets = JSON.parse(localStorage.getItem("aquaplan_presets_v6") || "[]");
  presets = presets.filter(p => p.id !== id);
  localStorage.setItem("aquaplan_presets_v6", JSON.stringify(presets));
  loadPresets();
}

loadPresets();
generateMenu();
</script>
