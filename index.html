<!DOCTYPE html>
<html lang="ja" class="h-full bg-slate-950">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AquaPlan PRO v4.0</title>
<!-- Tailwind CSS & Lucide Icons -->
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap');

  body {
    font-family: 'Noto Sans JP', sans-serif;
  }
  .font-cyber {
    font-family: 'Orbitron', sans-serif;
  }
  .font-mono-code {
    font-family: 'JetBrains Mono', monospace;
  }

  /* 画面表示用ネオンエフェクト */
  .neon-border-cyan { box-shadow: 0 0 10px rgba(6, 182, 212, 0.2), inset 0 0 10px rgba(6, 182, 212, 0.1); }
  .neon-border-blue { box-shadow: 0 0 10px rgba(59, 130, 246, 0.2), inset 0 0 10px rgba(59, 130, 246, 0.1); }
  .neon-border-indigo { box-shadow: 0 0 10px rgba(99, 102, 241, 0.2), inset 0 0 10px rgba(99, 102, 241, 0.1); }
  .neon-glow-btn { box-shadow: 0 0 15px rgba(6, 182, 212, 0.4); }
  .neon-glow-btn:hover { box-shadow: 0 0 25px rgba(6, 182, 212, 0.7); }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #090d16; }
  ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }

  /* --------------------------------------------------
     旧バージョン準拠 印刷用CSS (完全に旧仕様を再現)
  -------------------------------------------------- */
  @media print {
    body > *:not(.print-only) {
      display: none !important;
    }
    .print-only {
      display: block !important;
    }
    body {
      background-color: white !important;
      color: black !important;
      display: block !important;
      height: auto !important;
      min-height: 0 !important;
      font-size: 14px !important;
    }
    .print-card {
      border: 3px solid #000 !important;
      page-break-inside: avoid !important;
      break-inside: avoid !important;
      page-break-after: always !important;
      break-after: page !important;
      margin-bottom: 0 !important;
      padding: 1.75rem !important;
      border-radius: 8px !important;
      box-sizing: border-box !important;
      background: white !important;
    }
    .print-card:last-child {
      page-break-after: auto !important;
      break-after: auto !important;
    }
    table {
      page-break-inside: avoid !important;
      break-inside: avoid !important;
    }
    tr {
      page-break-inside: avoid !important;
      break-inside: avoid !important;
    }
  }

  @media screen {
    .print-only {
      display: none !important;
    }
  }
</style>
</head>
<body class="h-full text-slate-200 antialiased selection:bg-cyan-500 selection:text-slate-950">

<!-- 1. パスコード認証画面 -->
<div id="auth-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black">
  <div class="w-full max-w-md p-8 rounded-2xl bg-slate-900/80 border border-cyan-500/30 neon-border-cyan backdrop-blur-xl relative overflow-hidden">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-cyan-950/80 border border-cyan-500/40 mb-4 text-cyan-400 shadow-[0_0_15px_rgba(6,182,212,0.3)]">
        <i data-lucide="waves" class="w-8 h-8"></i>
      </div>
      <h1 class="text-2xl font-black tracking-wider text-white font-cyber">AquaPlan <span class="text-cyan-400">PRO</span> <span class="text-xs px-2 py-0.5 rounded bg-cyan-500/20 text-cyan-300 border border-cyan-500/40">v4.0</span></h1>
      <p class="text-xs text-slate-400 mt-2">SECURITY AUTHENTICATION</p>
    </div>

    <form onsubmit="handleAuth(event)" class="space-y-5">
      <div>
        <label class="block text-xs font-bold text-cyan-300 mb-2 tracking-widest uppercase flex items-center gap-1.5">
          <i data-lucide="key-round" class="w-3.5 h-3.5"></i> Access Passcode
        </label>
        <input type="password" id="passcode-input" placeholder="合言葉を入力 (swim2026)" class="w-full px-4 py-3 bg-slate-950/80 border border-slate-700 rounded-xl text-center text-lg font-mono-code tracking-widest text-white focus:outline-none focus:border-cyan-400">
      </div>
      <p id="auth-error" class="text-xs text-rose-500 text-center hidden font-bold">合言葉が正しくありません</p>
      <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-cyan-500 to-blue-600 text-slate-950 font-black tracking-wider rounded-xl neon-glow-btn transition-all duration-300 flex items-center justify-center gap-2">
        <i data-lucide="shield-check" class="w-5 h-5"></i> アクセス承認
      </button>
    </form>
  </div>
</div>

<!-- 2. メイン画面 (UI) -->
<div id="app-container" class="hidden min-h-screen flex flex-col no-print bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black">
  
  <!-- ヘッダー -->
  <header class="border-b border-slate-800/80 bg-slate-950/80 backdrop-blur-md sticky top-0 z-40">
    <div class="max-w-[1700px] mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="p-2 rounded-lg bg-cyan-950 border border-cyan-500/30 text-cyan-400">
          <i data-lucide="waves" class="w-5 h-5"></i>
        </div>
        <div>
          <span class="font-cyber font-black text-lg tracking-wider text-white">AquaPlan <span class="text-cyan-400">PRO</span> <span class="text-[10px] font-mono-code px-1.5 py-0.5 rounded bg-cyan-500/20 text-cyan-300 border border-cyan-500/30">v4.0</span></span>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="saveData()" class="px-3 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 border border-slate-700 text-xs font-bold text-slate-300 flex items-center gap-1.5">
          <i data-lucide="save" class="w-3.5 h-3.5 text-cyan-400"></i> 保存
        </button>
        <button onclick="loadData()" class="px-3 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 border border-slate-700 text-xs font-bold text-slate-300 flex items-center gap-1.5">
          <i data-lucide="download" class="w-3.5 h-3.5 text-emerald-400"></i> 復元
        </button>
        <div class="h-4 w-px bg-slate-800 mx-1"></div>
        <button onclick="printMultiLayout()" class="px-4 py-1.5 rounded-lg bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-black text-xs flex items-center gap-1.5 shadow-[0_0_10px_rgba(6,182,212,0.3)]">
          <i data-lucide="printer" class="w-4 h-4"></i> 📄 SWIM SHEET 印刷
        </button>
      </div>
    </div>
  </header>

  <!-- メインレイアウト -->
  <div class="flex-1 max-w-[1700px] w-full mx-auto p-4 lg:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
    
    <!-- サイドバー -->
    <aside class="lg:col-span-4 xl:col-span-3 space-y-5">
      <div class="p-5 rounded-2xl bg-slate-900/60 border border-slate-800 backdrop-blur-md space-y-5">
        <div class="flex items-center gap-2 border-b border-slate-800 pb-3">
          <i data-lucide="sliders" class="w-4 h-4 text-cyan-400"></i>
          <h2 class="text-sm font-bold tracking-wider text-slate-200">コンディション・設定</h2>
        </div>

        <div class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-400 mb-1 flex items-center gap-1">
              <i data-lucide="clock" class="w-3.5 h-3.5 text-cyan-400"></i> 開始時刻
            </label>
            <input type="time" id="start-time" value="16:30" onchange="recalculateAll()" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-sm font-mono-code text-cyan-300 focus:outline-none focus:border-cyan-500">
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-400 mb-1">プール環境</label>
            <div class="grid grid-cols-2 gap-2">
              <label class="flex items-center justify-center p-2 rounded-lg bg-slate-950 border border-slate-800 cursor-pointer text-xs font-bold text-slate-300 has-[:checked]:border-cyan-500 has-[:checked]:text-cyan-400">
                <input type="radio" name="pool-length" value="25" checked onchange="generateAllLanes()" class="hidden"> Short (25m)
              </label>
              <label class="flex items-center justify-center p-2 rounded-lg bg-slate-950 border border-slate-800 cursor-pointer text-xs font-bold text-slate-300 has-[:checked]:border-cyan-500 has-[:checked]:text-cyan-400">
                <input type="radio" name="pool-length" value="50" onchange="generateAllLanes()" class="hidden"> Long (50m)
              </label>
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-400 mb-1 flex items-center justify-between">
              <span>目標総距離</span>
              <span id="target-dist-val" class="text-cyan-400 font-mono-code font-bold">4000m</span>
            </label>
            <input type="range" id="target-distance" min="2000" max="8000" step="100" value="4000" oninput="document.getElementById('target-dist-val').innerText = this.value + 'm'" onchange="generateAllLanes()" class="w-full accent-cyan-400 bg-slate-950 h-2 rounded-lg">
          </div>
        </div>

        <!-- レーン設定 -->
        <div class="border-t border-slate-800 pt-4 space-y-3">
          <label class="block text-xs font-bold text-slate-400">レーン構成・基準タイム (100m)</label>
          <div class="space-y-2">
            <div class="p-2.5 rounded-lg bg-slate-950/80 border border-slate-800/80 flex items-center justify-between gap-2">
              <label class="flex items-center gap-2 cursor-pointer text-xs font-bold text-cyan-400">
                <input type="checkbox" id="lane-a-enable" checked onchange="generateAllLanes()" class="rounded border-slate-700 bg-slate-900 text-cyan-500"> Lane A
              </label>
              <div class="flex items-center gap-1 text-xs">
                <span class="text-slate-500 font-mono-code">基準:</span>
                <input type="text" id="lane-a-base" value="1'10" onchange="generateAllLanes()" class="w-16 px-1.5 py-1 bg-slate-900 border border-slate-700 rounded text-center font-mono-code text-white text-xs">
              </div>
            </div>
            <div class="p-2.5 rounded-lg bg-slate-950/80 border border-slate-800/80 flex items-center justify-between gap-2">
              <label class="flex items-center gap-2 cursor-pointer text-xs font-bold text-blue-400">
                <input type="checkbox" id="lane-b-enable" checked onchange="generateAllLanes()" class="rounded border-slate-700 bg-slate-900 text-blue-500"> Lane B
              </label>
              <div class="flex items-center gap-1 text-xs">
                <span class="text-slate-500 font-mono-code">基準:</span>
                <input type="text" id="lane-b-base" value="1'20" onchange="generateAllLanes()" class="w-16 px-1.5 py-1 bg-slate-900 border border-slate-700 rounded text-center font-mono-code text-white text-xs">
              </div>
            </div>
            <div class="p-2.5 rounded-lg bg-slate-950/80 border border-slate-800/80 flex items-center justify-between gap-2">
              <label class="flex items-center gap-2 cursor-pointer text-xs font-bold text-indigo-400">
                <input type="checkbox" id="lane-c-enable" checked onchange="generateAllLanes()" class="rounded border-slate-700 bg-slate-900 text-indigo-500"> Lane C
              </label>
              <div class="flex items-center gap-1 text-xs">
                <span class="text-slate-500 font-mono-code">基準:</span>
                <input type="text" id="lane-c-base" value="1'35" onchange="generateAllLanes()" class="w-16 px-1.5 py-1 bg-slate-900 border border-slate-700 rounded text-center font-mono-code text-white text-xs">
              </div>
            </div>
          </div>
        </div>

        <!-- マテリアル -->
        <div class="border-t border-slate-800 pt-4 space-y-2">
          <label class="block text-xs font-bold text-slate-400">使用マテリアル</label>
          <div class="grid grid-cols-2 gap-2 text-xs font-bold text-slate-300">
            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="gear-board" checked class="rounded border-slate-700 bg-slate-950 text-cyan-500"> ビート板</label>
            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="gear-buoy" checked class="rounded border-slate-700 bg-slate-950 text-cyan-500"> プルブイ</label>
            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="gear-paddle" checked class="rounded border-slate-700 bg-slate-950 text-cyan-500"> パドル</label>
            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="gear-fin" checked class="rounded border-slate-700 bg-slate-950 text-cyan-500"> フィン</label>
          </div>
        </div>

        <button onclick="generateAllLanes()" class="w-full py-3.5 bg-gradient-to-r from-cyan-500 via-blue-600 to-indigo-600 text-slate-950 font-black tracking-wider text-sm rounded-xl neon-glow-btn transition-all duration-300 flex items-center justify-center gap-2">
          <i data-lucide="cpu" class="w-4 h-4"></i> メニュー自動再生成
        </button>
      </div>
    </aside>

    <!-- メイン表示領域 -->
    <main class="lg:col-span-8 xl:col-span-9 space-y-6">
      <div class="grid grid-cols-1 xl:grid-cols-3 gap-5" id="lanes-board"></div>
    </main>

  </div>
</div>

<!-- 3. 旧バージョン完全互換 SWIM SHEET (印刷専用エリア) -->
<div class="print-only p-4 bg-white text-black min-h-screen">
  <div class="flex justify-between items-center border-b-4 border-black pb-2 mb-4">
    <h1 class="text-2xl font-black">AquaPlan SWIM SHEET</h1>
    <span id="print-sheet-date" class="text-sm font-bold text-gray-700"></span>
  </div>
  <div id="print-lanes-container" class="space-y-6"></div>
</div>

<script>
const PASSCODE = "swim2026";
let lanesData = {
  A: { enabled: true, name: "Lane A", basePaceSec: 70, coachingTip: "フォームを崩さずサークルキープ。後半までピッチを落とさない。", items: [] },
  B: { enabled: true, name: "Lane B", basePaceSec: 80, coachingTip: "ストローク効率を意識して大きく泳ぐ。キャッチ位置の固定。", items: [] },
  C: { enabled: true, name: "Lane C", basePaceSec: 95, coachingTip: "呼吸動作での減速を防ぐ。リズム一定を重視。", items: [] }
};

function handleAuth(e) {
  e.preventDefault();
  if (document.getElementById('passcode-input').value === PASSCODE) {
    document.getElementById('auth-screen').classList.add('hidden');
    document.getElementById('app-container').classList.remove('hidden');
    generateAllLanes();
  } else {
    document.getElementById('auth-error').classList.remove('hidden');
  }
}

function parsePaceToSec(str) {
  if (!str) return 80;
  if (str.includes("'")) {
    const parts = str.split("'");
    return (parseInt(parts[0]) || 0) * 60 + (parseInt(parts[1]) || 0);
  }
  return parseInt(str) || 80;
}

function formatSeconds(totalSec) {
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return `${m}'${String(s).padStart(2, '0')}`;
}

function formatClockTime(totalSec) {
  const h = Math.floor(totalSec / 3600) % 24;
  const m = Math.floor((totalSec % 3600) / 60);
  return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
}

// 旧バージョンメニュー構築ロジック
function generateAllLanes() {
  const targetDist = parseInt(document.getElementById('target-distance').value);
  const poolLen = parseInt(document.querySelector('input[name="pool-length"]:checked').value);
  const gear = {
    board: document.getElementById('gear-board').checked,
    buoy: document.getElementById('gear-buoy').checked,
    paddle: document.getElementById('gear-paddle').checked,
    fin: document.getElementById('gear-fin').checked
  };

  ['A', 'B', 'C'].forEach(key => {
    const enable = document.getElementById(`lane-${key.toLowerCase()}-enable`).checked;
    const basePaceSec = parsePaceToSec(document.getElementById(`lane-${key.toLowerCase()}-base`).value);

    lanesData[key].enabled = enable;
    lanesData[key].basePaceSec = basePaceSec;

    if (!enable) {
      lanesData[key].items = [];
      return;
    }

    lanesData[key].items = buildOldVersionMenu(targetDist, poolLen, basePaceSec, gear);
  });

  recalculateAll();
}

function buildOldVersionMenu(targetDist, poolLen, basePaceSec, gear) {
  let items = [];
  const adjustDist = (d) => (poolLen === 50 && d % 50 !== 0) ? Math.ceil(d / 50) * 50 : d;

  const wuDist = adjustDist(targetDist >= 4000 ? 400 : 300);
  items.push({ phase: 'Warm up', style: 'Choice', desc: 'ゆっくりフォーム確認', dist: wuDist, reps: 1, circleSec: Math.round((wuDist / 100) * basePaceSec * 1.25) });

  const drillDist = adjustDist(50);
  items.push({ phase: 'Drill', style: 'Form Drill', desc: 'キャッチ・呼吸動作確認', dist: drillDist, reps: 4, circleSec: Math.round((drillDist / 100) * basePaceSec * 1.4) });

  let kickStyle = 'Kick (Choice)';
  if (gear.board) kickStyle = 'Kick W/Board';
  else if (gear.fin) kickStyle = 'Kick W/Fin';
  const kickDist = adjustDist(50);
  const kickReps = targetDist >= 4000 ? 6 : 4;
  items.push({ phase: 'Kick', style: kickStyle, desc: '軸を安定させてキック', dist: kickDist, reps: kickReps, circleSec: Math.round((kickDist / 100) * basePaceSec * 1.35) });

  let pullStyle = 'Pull (Choice)';
  if (gear.buoy && gear.paddle) pullStyle = 'Pull W/Buoy&Paddle';
  else if (gear.buoy) pullStyle = 'Pull W/Buoy';
  const pullDist = adjustDist(100);
  items.push({ phase: 'Pull', style: pullStyle, desc: 'ハイキャッチを意識', dist: pullDist, reps: 4, circleSec: Math.round((pullDist / 100) * basePaceSec * 1.2) });

  const downDist = adjustDist(200);
  const fixedSum = wuDist + (drillDist * 4) + (kickDist * kickReps) + (pullDist * 4) + downDist;
  let remDist = Math.max(300, targetDist - fixedSum);

  let mainDist = adjustDist(targetDist >= 5000 ? 200 : 100);
  let mainReps = Math.max(2, Math.round(remDist / mainDist));
  items.push({ phase: 'Main', style: 'Fr Pace', desc: '目標ペースを堅持', dist: mainDist, reps: mainReps, circleSec: Math.round((mainDist / 100) * basePaceSec * 1.1) });

  items.push({ phase: 'Down', style: 'Easy Choice', desc: 'クールダウン', dist: downDist, reps: 1, circleSec: Math.round((downDist / 100) * basePaceSec * 1.4) });

  return items;
}

function recalculateAll() {
  const startTimeStr = document.getElementById('start-time').value || "16:30";
  const [startH, startM] = startTimeStr.split(':').map(Number);
  const startSecBase = (startH * 3600) + (startM * 60);

  ['A', 'B', 'C'].forEach(key => {
    const lane = lanesData[key];
    if (!lane.enabled) return;

    let currentSec = startSecBase;
    let totalD = 0;

    lane.items.forEach((item) => {
      item.startTimeStr = formatClockTime(currentSec);
      totalD += (item.dist * item.reps);
      currentSec += (item.circleSec * item.reps);
      item.endTimeStr = formatClockTime(currentSec);
    });

    lane.totalDist = totalD;
    lane.totalTimeSec = currentSec - startSecBase;
  });

  renderBoard();
}

function deleteItem(laneKey, idx) {
  lanesData[laneKey].items.splice(idx, 1);
  recalculateAll();
}

function updateItemVal(laneKey, idx, field, val) {
  if (field === 'style' || field === 'desc' || field === 'phase') {
    lanesData[laneKey].items[idx][field] = val;
  } else if (field === 'circleSecStr') {
    lanesData[laneKey].items[idx].circleSec = parsePaceToSec(val);
  } else {
    lanesData[laneKey].items[idx][field] = parseInt(val) || 0;
  }
  recalculateAll();
}

function renderBoard() {
  const container = document.getElementById('lanes-board');
  container.innerHTML = '';
  const colors = { A: 'cyan', B: 'blue', C: 'indigo' };

  ['A', 'B', 'C'].forEach(key => {
    const lane = lanesData[key];
    if (!lane.enabled) return;

    const c = colors[key];
    const totalMin = Math.round(lane.totalTimeSec / 60);

    let html = `
      <div class="rounded-2xl bg-slate-900/80 border border-${c}-500/30 neon-border-${c} backdrop-blur-md flex flex-col h-full overflow-hidden">
        <div class="p-4 border-b border-slate-800 bg-slate-950/60 flex items-center justify-between">
          <div>
            <span class="text-xs font-cyber text-${c}-400 font-bold tracking-wider">${lane.name}</span>
            <div class="flex items-center gap-2 mt-0.5">
              <span class="text-xs text-slate-400 font-mono-code">Total: <b class="text-white">${lane.totalDist}m</b></span>
              <span class="text-xs text-slate-500">|</span>
              <span class="text-xs text-slate-400 font-mono-code">Time: <b class="text-white">${totalMin} min</b></span>
            </div>
          </div>
          <div class="text-right">
            <span class="text-[10px] text-slate-500 font-mono-code block">基準タイム</span>
            <span class="text-sm font-black font-mono-code text-${c}-400">${formatSeconds(lane.basePaceSec)}</span>
          </div>
        </div>

        <div class="p-3 space-y-2.5 flex-1 overflow-y-auto max-h-[calc(100vh-280px)]">
    `;

    lane.items.forEach((item, idx) => {
      html += `
        <div class="p-3 rounded-xl bg-slate-950/90 border border-slate-800/80 hover:border-slate-700 transition-all space-y-2">
          <div class="flex items-center justify-between text-xs">
            <div class="flex items-center gap-1.5 font-mono-code text-[11px] text-slate-400">
              <span class="text-cyan-400 font-bold">${item.startTimeStr}</span>
              <span>-</span>
              <span>${item.endTimeStr}</span>
            </div>
            <button onclick="deleteItem('${key}', ${idx})" class="text-slate-600 hover:text-rose-400 transition-colors">
              <i data-lucide="x" class="w-3.5 h-3.5"></i>
            </button>
          </div>

          <div class="grid grid-cols-12 gap-2 items-center">
            <div class="col-span-4">
              <input type="text" value="${item.phase}" onchange="updateItemVal('${key}', ${idx}, 'phase', this.value)" class="text-[10px] font-bold text-slate-400 uppercase bg-transparent w-full">
              <input type="text" value="${item.style}" onchange="updateItemVal('${key}', ${idx}, 'style', this.value)" class="w-full bg-transparent font-bold text-xs text-slate-200 focus:outline-none">
            </div>

            <div class="col-span-8 flex items-center justify-end gap-1 text-xs font-mono-code">
              <input type="number" value="${item.dist}" step="25" onchange="updateItemVal('${key}', ${idx}, 'dist', this.value)" class="w-12 px-1 py-0.5 bg-slate-900 border border-slate-800 rounded text-center text-cyan-300 font-bold">
              <span class="text-slate-500">m</span>
              <span class="text-slate-600">×</span>
              <input type="number" value="${item.reps}" step="1" onchange="updateItemVal('${key}', ${idx}, 'reps', this.value)" class="w-10 px-1 py-0.5 bg-slate-900 border border-slate-800 rounded text-center text-white font-bold">
              <span class="text-slate-500">本</span>
              <span class="text-slate-600">@</span>
              <input type="text" value="${formatSeconds(item.circleSec)}" onchange="updateItemVal('${key}', ${idx}, 'circleSecStr', this.value)" class="w-14 px-1 py-0.5 bg-slate-900 border border-slate-800 rounded text-center text-amber-400 font-bold">
            </div>
          </div>
        </div>
      `;
    });

    html += `
        </div>
      </div>
    `;

    container.innerHTML += html;
  });

  lucide.createIcons();
}

/* --------------------------------------------------
   送っていただいた旧バージョンの printMultiLayout() 関数を完全統合
-------------------------------------------------- */
function printMultiLayout() {
  if (document.activeElement && document.activeElement.blur) {
    document.activeElement.blur();
  }

  const container = document.getElementById('print-lanes-container');
  container.innerHTML = '';

  const todayStr = new Date().toLocaleDateString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit' });
  document.getElementById('print-sheet-date').innerText = `作成日: ${todayStr}`;

  ['A', 'B', 'C'].forEach(key => {
    const menu = lanesData[key];
    if (!menu.enabled) return;

    let exactTotal = 0;
    let exactTime = Math.round(menu.totalTimeSec / 60);
    let trs = '';

    menu.items.forEach(s => {
      exactTotal += (s.dist * s.reps);
      trs += `
        <tr class="border-b border-gray-300 text-sm">
          <td class="py-2 px-2.5 font-bold text-gray-900 border-r border-gray-300" style="width: 100px;">${s.phase}</td>
          <td class="py-2 px-2.5 font-black text-gray-950 border-r border-gray-300" style="width: 160px;">${s.style}</td>
          <td class="py-2 px-2.5 text-gray-800 leading-normal border-r border-gray-300">
            <span class="font-mono text-xs font-bold text-gray-600 mr-2">[${s.startTimeStr}-${s.endTimeStr}]</span>${s.desc}
          </td>
          <td class="py-2 px-2.5 text-right font-bold text-gray-950 whitespace-nowrap border-r border-gray-300" style="width: 100px;">${s.dist}m × ${s.reps}</td>
          <td class="py-2 px-2.5 text-right font-black text-blue-900 whitespace-nowrap" style="width: 100px;">${formatSeconds(s.circleSec)}</td>
        </tr>
      `;
    });

    const sec = document.createElement('div');
    sec.className = "print-card bg-white text-black p-6 rounded-lg";
    sec.innerHTML = `
      <div class="flex justify-between items-end border-b-4 border-black pb-2 mb-4">
        <div>
          <h2 class="text-2xl font-black text-black tracking-tight">${menu.name}</h2>
          <p class="text-xs text-gray-600 font-bold">基準100mベースタイム目安: ${formatSeconds(menu.basePaceSec)} | 目安時間: <span class="text-blue-800 font-extrabold">${exactTime}分</span></p>
        </div>
        <span class="text-3xl font-black text-black">${exactTotal}m</span>
      </div>
      <table class="w-full text-left border-collapse border-2 border-black mb-4">
        <thead>
          <tr class="bg-gray-100 text-xs font-bold border-b-2 border-black">
            <th class="py-2 px-2.5 border-r border-gray-300 text-black">Phase</th>
            <th class="py-2 px-2.5 border-r border-gray-300 text-black">Style</th>
            <th class="py-2 px-2.5 border-r border-gray-300 text-black">Description</th>
            <th class="py-2 px-2.5 text-right border-r border-gray-300 text-black">Reps</th>
            <th class="py-2 px-2.5 text-right text-black">Cycle</th>
          </tr>
        </thead>
        <tbody>${trs}</tbody>
      </table>
      <div class="text-xs border-t border-dashed border-gray-400 pt-3">
        <span class="font-bold text-black uppercase"> 【コーチ指導指示】:</span>
        <span class="text-gray-900 font-medium leading-relaxed">${menu.coachingTip || ''}</span>
      </div>
    `;

    container.appendChild(sec);
  });

  window.print();
}

function saveData() {
  const payload = {
    lanesData: lanesData,
    startTime: document.getElementById('start-time').value,
    targetDist: document.getElementById('target-distance').value
  };
  localStorage.setItem('aquaplan_v4_config', JSON.stringify(payload));
  alert('⚡ 設定とメニューデータを保存しました。');
}

function loadData() {
  const saved = localStorage.getItem('aquaplan_v4_config');
  if (!saved) return alert('保存データがありません。');
  const payload = JSON.parse(saved);
  lanesData = payload.lanesData;
  if (payload.startTime) document.getElementById('start-time').value = payload.startTime;
  if (payload.targetDist) {
    document.getElementById('target-distance').value = payload.targetDist;
    document.getElementById('target-dist-val').innerText = payload.targetDist + 'm';
  }
  recalculateAll();
  alert('⚡ データを復元しました。');
}

window.addEventListener('DOMContentLoaded', () => {
  lucide.createIcons();
});
</script>
</body>
</html>
