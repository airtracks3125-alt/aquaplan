<!DOCTYPE html>
<html lang="ja" class="h-full bg-slate-950">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AquaPlan PRO v4.0</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap');

  body { font-family: 'Noto Sans JP', sans-serif; }
  .font-cyber { font-family: 'Orbitron', sans-serif; }
  .font-mono-code { font-family: 'JetBrains Mono', monospace; }

  .neon-border-cyan { box-shadow: 0 0 10px rgba(6, 182, 212, 0.2), inset 0 0 10px rgba(6, 182, 212, 0.1); }
  .neon-border-blue { box-shadow: 0 0 10px rgba(59, 130, 246, 0.2), inset 0 0 10px rgba(59, 130, 246, 0.1); }
  .neon-border-indigo { box-shadow: 0 0 10px rgba(99, 102, 241, 0.2), inset 0 0 10px rgba(99, 102, 241, 0.1); }
  .neon-glow-btn { box-shadow: 0 0 15px rgba(6, 182, 212, 0.4); }
  .neon-glow-btn:hover { box-shadow: 0 0 25px rgba(6, 182, 212, 0.7); }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #090d16; }
  ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }

  .lib-chip {
    padding: 0.3rem 0.65rem;
    border-radius: 9999px;
    font-size: 0.65rem;
    font-weight: 700;
    border: 1px solid rgb(51 65 85);
    background: rgba(2, 6, 23, 0.6);
    color: rgb(148 163 184);
    font-family: 'JetBrains Mono', monospace;
    cursor: pointer;
    transition: all .15s;
  }
  .lib-chip:hover { border-color: rgba(6, 182, 212, 0.5); color: #22d3ee; }
  .lib-chip-active {
    background: rgba(6, 182, 212, 0.2);
    border-color: rgba(6, 182, 212, 0.6);
    color: #22d3ee;
    box-shadow: 0 0 8px rgba(6, 182, 212, 0.3);
  }
  .lib-tab-btn {
    color: rgb(100 116 139);
    background: transparent;
    border-bottom: 2px solid transparent;
    transition: all .15s;
  }
  .lib-tab-btn:hover { color: rgb(203 213 225); }
  .lib-tab-active {
    color: #22d3ee !important;
    border-bottom-color: #22d3ee !important;
  }

  /* Print CSS omitted for brevity (unchanged) ... */

  /* Modal / Library fixes for scrollable search tab */
  #library-modal > div {
    min-height: 0 !important;
    min-width: 0 !important;
  }

  /*
   * Make search tab a column flex container:
   *  - Top: filter area (natural height)
   *  - Bottom: results area (flex-1, min-h-0) -> becomes the true scroll viewport
   */
  #lib-tab-search {
    display: flex !important;
    flex-direction: column !important;
    flex: 1 1 0% !important;
    min-height: 0 !important;
    min-width: 0 !important;
    overflow: hidden !important;
  }

  /* Make the top filter area non-growing (keeps its height) */
  #lib-tab-search > :first-child {
    flex: 0 0 auto !important;
    min-height: 0 !important;
    min-width: 0 !important;
    overflow: visible !important;
  }

  /*
   * The actual list viewport MUST be a flex child that can shrink to 0
   * and provide its own scroll. Key properties:
   *  - flex:1 (grow to available space)
   *  - min-height:0 (allow shrinking inside flex)
   *  - overflow-y:auto
   *  - -webkit-overflow-scrolling: touch (smooth touch scrolling on iOS)
   *  - touch-action: pan-y (allow vertical panning)
   *  - overscroll-behavior: contain (prevent ancestor/body scroll when at edges)
   */
  #library-results {
    display: block !important;
    width: 100% !important;
    flex: 1 1 0% !important;
    min-height: 0 !important;
    min-width: 0 !important;
    max-height: none !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    overscroll-behavior: contain !important;
    touch-action: pan-y !important;
    -webkit-overflow-scrolling: touch !important;
    box-sizing: border-box !important;
  }

  /* For consistency, create-tab's scroll area should also be flexible */
  #lib-tab-create {
    flex: 1 1 0% !important;
    min-height: 0 !important;
    min-width: 0 !important;
    overflow: hidden !important;
  }
  #lib-tab-create > .lib-scroll-area {
    flex: 1 1 0% !important;
    min-height: 0 !important;
    min-width: 0 !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    touch-action: pan-y !important;
    -webkit-overflow-scrolling: touch !important;
  }

  /* Small helper so library result cards won't capture pointer events unexpectedly */
  .library-card {
    pointer-events: auto;
  }

</style>
</head>
<body class="h-full text-slate-200 antialiased selection:bg-cyan-500 selection:text-slate-950">

<!-- (auth screen / main UI omitted for brevity; unchanged) ... -->

<!-- Library modal (fixed/updated portions) -->
<div id="library-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm p-4 overscroll-contain" onclick="if(event.target===this) closeLibraryModal()">
  <div
    class="w-full max-w-5xl rounded-2xl bg-slate-900 border border-slate-700 neon-border-cyan backdrop-blur-md flex flex-col overflow-hidden"
    style="height:85vh; max-height:85vh;"
    role="dialog" aria-modal="true" aria-label="Menu Library"
  >
    <div class="p-4 border-b border-slate-800 flex items-center justify-between shrink-0 flex-shrink-0">
      <div class="flex items-center gap-2">
        <i data-lucide="library" class="w-5 h-5 text-cyan-400"></i>
        <h2 class="font-cyber font-black text-white tracking-wider">MENU LIBRARY</h2>
      </div>
      <button onclick="closeLibraryModal()" class="text-slate-400 hover:text-white" aria-label="閉じる">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>

    <div class="flex border-b border-slate-800 shrink-0 flex-shrink-0">
      <button type="button" id="lib-tab-btn-search" onclick="switchLibraryTab('search')" class="lib-tab-btn lib-tab-active flex-1 py-2.5 text-xs font-bold flex items-center justify-center gap-1.5">
        <i data-lucide="search" class="w-3.5 h-3.5"></i> ライブラリ検索
      </button>
      <button type="button" id="lib-tab-btn-create" onclick="switchLibraryTab('create')" class="lib-tab-btn flex-1 py-2.5 text-xs font-bold flex items-center justify-center gap-1.5">
        <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i> 新規メニュー登録
      </button>
    </div>

    <!-- 検索タブ（修正: flex column / results が flex-1 になる） -->
    <div id="lib-tab-search" class="flex-1 min-h-0 overflow-hidden">
      <div class="p-4 border-b border-slate-800 space-y-3 bg-slate-950/40 shrink-0 flex-shrink-0">
        <input type="text" id="lib-search-text" placeholder="メニュー名で検索..." oninput="renderLibraryResults()" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-sm text-white">

        <div>
          <div class="text-[10px] font-bold text-slate-500 mb-1 uppercase tracking-wider">強度 (Intensity)</div>
          <div id="lib-chips-intensity" class="flex flex-wrap gap-1.5"></div>
        </div>
        <div>
          <div class="text-[10px] font-bold text-slate-500 mb-1 uppercase tracking-wider">動作 (Phase)</div>
          <div id="lib-chips-phase" class="flex flex-wrap gap-1.5"></div>
        </div>
        <div>
          <div class="text-[10px] font-bold text-slate-500 mb-1 uppercase tracking-wider">道具 (Gear)</div>
          <div id="lib-chips-gear" class="flex flex-wrap gap-1.5"></div>
        </div>
        <div>
          <div class="text-[10px] font-bold text-slate-500 mb-1 uppercase tracking-wider">種目 (Style)</div>
          <div id="lib-chips-style" class="flex flex-wrap gap-1.5"></div>
        </div>

        <div class="flex items-center justify-between gap-2 pt-1">
          <div id="library-result-count" class="text-[11px] text-slate-500 font-mono-code"></div>
          <select id="lib-target-lane" class="px-2 py-1.5 bg-slate-950 border border-cyan-700 rounded-lg text-xs text-cyan-300 font-bold focus:outline-none">
            <option value="A">追加先: Lane A</option>
            <option value="B">追加先: Lane B</option>
            <option value="C">追加先: Lane C</option>
          </select>
        </div>
      </div>

      <!-- ここが実際にスクロールするコンテナ -->
      <div id="library-results" class="lib-scroll-area p-4 space-y-2">
        <!-- 検索結果カードがここに renderLibraryResults() で挿入される -->
      </div>
    </div>

    <!-- 新規メニュー登録タブ -->
    <div id="lib-tab-create" class="hidden flex flex-col flex-1 min-h-0" style="flex-direction:column; flex:1 1 0%; min-height:0;">
      <div class="lib-scroll-area flex-1 min-h-0 overflow-y-auto overscroll-contain touch-pan-y p-4">
        <form id="new-library-form" onsubmit="submitNewLibraryItem(event)" class="space-y-4">
          <!-- フォーム内容（省略可：既存のフォームと同じ） -->
          <div>
            <label class="block text-xs font-bold text-slate-400 mb-1">メニュー名</label>
            <input type="text" id="nf-name" required class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-sm text-white focus:outline-none focus:border-cyan-500">
          </div>
          <!-- ... 残りのフォーム要素 ... -->
        </form>
      </div>

      <div class="flex-shrink-0 border-t border-slate-800 p-4">
        <button type="submit" form="new-library-form" class="w-full py-3 bg-gradient-to-r from-cyan-500 to-blue-600 text-slate-950 font-black rounded-xl neon-glow-btn flex items-center justify-center">
          <i data-lucide="save" class="w-4 h-4"></i> ライブラリに保存
        </button>
      </div>
    </div>
  </div>
</div>

<script>
/* ---- 既存コード: ライブラリ用定数/関数等 (省略せず必要に応じて全体を保持) ---- */
/* ここでは該当する関数群が既に定義されている前提です（ユーザーの元ファイルのまま流用） */
/* 主要な関数: renderAllFilterChips(), renderLibraryResults(), setLibraryFilter(), getFullLibrary(), makeLibraryItem(), etc. */

/* ---- 重要: タブ切替関数を確実に修正 ---- */
function switchLibraryTab(tab) {
  const isSearch = tab === 'search';

  const searchPanel = document.getElementById('lib-tab-search');
  const createPanel = document.getElementById('lib-tab-create');
  const searchButton = document.getElementById('lib-tab-btn-search');
  const createButton = document.getElementById('lib-tab-btn-create');

  if (!searchPanel || !createPanel || !searchButton || !createButton) return;

  // 明示的に flex で切替（grid は高さ計算が変わることがあるため）
  searchPanel.style.display = isSearch ? 'flex' : 'none';
  createPanel.style.display = isSearch ? 'none' : 'flex';

  // Tab ボタンの見た目切替
  if (isSearch) {
    searchButton.classList.add('lib-tab-active');
    createButton.classList.remove('lib-tab-active');
    // 初回表示時にフィルタチップを初期化（必要なら）
    initLibraryFiltersOnce();
    // 再描画して確実に結果を埋める
    renderLibraryResults();
  } else {
    createButton.classList.add('lib-tab-active');
    searchButton.classList.remove('lib-tab-active');
  }

  // フォーカスの補正: 検索タブを開いたら検索入力にフォーカス
  if (isSearch) {
    const input = document.getElementById('lib-search-text');
    if (input) {
      setTimeout(() => input.focus(), 50);
    }
  }
}

/* ---- 補助: ライブラリ関連の初期化 (既存の loadCustomLibrary 等と組み合わせて呼ぶ) ---- */
function openLibraryModal() {
  const modal = document.getElementById('library-modal');
  if (!modal) return;
  modal.classList.remove('hidden');

  // 初期タブは検索にセット
  switchLibraryTab('search');

  // ライブラリフィルタ初期化（1回のみ）
  initLibraryFiltersOnce();

  // 読み込み済みのカスタム項目をロードしておく
  try { loadCustomLibrary(); } catch (e) { /* ignore */ }

  // 描画
  renderLibraryResults();
}

function closeLibraryModal() {
  const modal = document.getElementById('library-modal');
  if (!modal) return;
  modal.classList.add('hidden');
}

/* ---- 既存: renderLibraryResults の一例（必要に応じて本体をそのまま使う） ---- */
function renderLibraryResults() {
  const container = document.getElementById('library-results');
  if (!container) return;
  const text = (document.getElementById('lib-search-text') || {}).value || '';
  const query = {
    text: text,
    phase: libraryFilterState.phase,
    intensity: libraryFilterState.intensity,
    style: libraryFilterState.style,
    gear: libraryFilterState.gear
  };
  const results = searchLibrary(query);

  document.getElementById('library-result-count').innerText = `${results.length} 件`;

  // render
  container.innerHTML = '';
  results.forEach(item => {
    const card = document.createElement('div');
    card.className = 'library-card p-3 rounded-lg bg-slate-900 border border-slate-800';
    // simple card content (expand as needed)
    const title = document.createElement('div');
    title.className = 'text-sm font-bold text-white';
    title.innerText = item.name;
    const meta = document.createElement('div');
    meta.className = 'text-xs text-slate-400 mt-1';
    meta.innerText = `${PHASE_LABELS[item.phase] || item.phase} · ${INTENSITY_LABELS[item.intensity] || item.intensity} · ${item.dist}m × ${item.reps}`;
    const addBtn = document.createElement('button');
    addBtn.className = 'mt-2 px-2 py-1 rounded bg-cyan-600 text-xs text-slate-950 font-bold';
    addBtn.innerText = '追加';
    addBtn.onclick = () => { /* 追加処理（既存関数に委譲） */ };

    card.appendChild(title);
    card.appendChild(meta);
    card.appendChild(addBtn);

    // show incompat warnings if any
    const warnings = getIncompatibilityWarnings(item);
    if (warnings.length) {
      const w = document.createElement('div');
      w.className = 'text-xs text-rose-400 mt-2';
      w.innerText = warnings.join(' / ');
      card.appendChild(w);
    }

    container.appendChild(card);
  });
}

/* ---- 初期処理（ページロード時に必要な処理） ---- */
document.addEventListener('DOMContentLoaded', () => {
  // モーダルの初期フィルター描画（ただし実際にモーダルを開くまで重くしたくない場合は省略可）
  // initLibraryFiltersOnce() will be called when opening modal, but we can prepare if desired.
  // initLibraryFiltersOnce();

  // 例: ライブラリを開くためのボタンに紐付け（ヘッダーの「ライブラリ」ボタン）
  const libBtn = document.querySelector('button[onclick="openLibraryModal()"]');
  if (libBtn) libBtn.addEventListener('click', openLibraryModal);
});

/* ---- 既存のその他関数 (省略) ---- */
</script>
</body>
</html>
