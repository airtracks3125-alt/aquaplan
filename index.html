<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AQUAPLAN - SWIM TRAINING SPEC SHEET</title>
  <style>
    :root {
      --primary: #0284c7;
      --text-main: #0f172a;
      --text-sub: #475569;
      --bg-gray: #f8fafc;
      --border-color: #cbd5e1;
    }
    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
      color: var(--text-main); margin: 0; padding: 20px; background-color: #e2e8f0;
    }
    .container {
      max-width: 950px; margin: 0 auto; background: #fff; padding: 30px;
      border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .control-panel {
      background: var(--bg-gray); border: 1px solid var(--border-color);
      border-radius: 8px; padding: 15px 20px; margin-bottom: 20px;
      display: flex; flex-wrap: wrap; gap: 15px; align-items: center; justify-content: space-between;
    }
    .control-group { display: flex; align-items: center; gap: 8px; }
    .control-group label { font-size: 0.85rem; font-weight: bold; color: var(--text-sub); }
    .control-group select, .control-group input {
      padding: 8px 12px; border: 1px solid var(--border-color);
      border-radius: 6px; font-weight: bold; font-size: 0.9rem; outline: none;
    }
    .btn-generate {
      padding: 10px 20px; background-color: var(--primary); color: #fff;
      font-size: 0.95rem; font-weight: bold; border: none; border-radius: 6px;
      cursor: pointer; transition: background 0.2s;
    }
    .btn-generate:hover { background-color: #0369a1; }

    .header {
      border-bottom: 3px solid var(--primary); padding-bottom: 15px; margin-bottom: 20px;
      display: flex; justify-content: space-between; align-items: flex-end;
    }
    .header h1 { margin: 0; color: var(--primary); font-size: 2rem; letter-spacing: 1px; }
    .header-sub { font-size: 0.85rem; font-weight: bold; color: var(--text-sub); }
    
    .concept-box {
      background-color: #f0f9ff; border-left: 4px solid var(--primary);
      padding: 10px 15px; margin-bottom: 20px; font-weight: bold; color: #0369a1;
      font-size: 0.95rem;
    }

    table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 0.88rem; }
    th, td { border: 1px solid var(--border-color); padding: 10px 12px; vertical-align: top; }
    th { background-color: var(--text-main); color: #fff; font-size: 0.8rem; text-align: left; }
    
    .badge-zone { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; color: #fff; }
    .zone-a1 { background-color: #22c55e; }
    .zone-a2 { background-color: #10b981; }
    .zone-en1 { background-color: #0284c7; }
    .zone-en2 { background-color: #2563eb; }
    .zone-sp1 { background-color: #ef4444; }
    
    .badge-gear { display: inline-block; padding: 2px 6px; background-color: #0284c7; color: #fff; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
    .cycle-badge { display: inline-flex; align-items: center; background-color: #e0f2fe; color: #0f172a; padding: 3px 6px; border-radius: 4px; font-weight: bold; font-family: monospace; font-size: 0.85rem; border: 1px solid #bae6fd; }

    .stealth-editor { width: 100%; min-height: 40px; outline: none; white-space: pre-wrap; word-wrap: break-word; color: var(--text-sub); line-height: 1.5; padding: 4px; border-radius: 4px; }
    .stealth-editor:hover { background-color: #f1f5f9; }
    .stealth-editor:focus { background-color: #fff; box-shadow: 0 0 0 2px var(--primary); }

    .menu-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; font-weight: bold; font-size: 1rem; }
    .set-header { border-bottom: 1px dashed var(--border-color); padding-bottom: 4px; margin-bottom: 8px; color: var(--primary); font-weight: bold; font-size: 0.9rem; }
  </style>
</head>
<body>

<div class="container">
  <!-- コントロールパネル -->
  <div class="control-panel">
    <div class="control-group">
      <label>🎯 テーマ:</label>
      <select id="theme-select">
        <option value="SPEED">【スピード強化】Max Speed & 反応向上</option>
        <option value="ENDURANCE">【持久力向上】ATペーストレーニング</option>
        <option value="TECHNIQUE">【テクニック改善】フォーム・ストローク効率</option>
      </select>
    </div>

    <div class="control-group">
      <label>🏊 タイム基準:</label>
      <select id="level-select">
        <option value="ADVANCED">選手選抜・上級</option>
        <option value="INTERMEDIATE" selected>選手育成・中級</option>
        <option value="JUNIOR">ジュニア・初級</option>
      </select>
    </div>

    <div class="control-group">
      <label>⏰ 開始:</label>
      <input type="time" id="start-time" value="10:00">
    </div>

    <button class="btn-generate" onclick="generateMenu()">🔄 生成</button>
  </div>

  <!-- ヘッダー -->
  <div class="header">
    <div>
      <h1>AQUAPLAN</h1>
      <div class="header-sub">SWIM TRAINING SPEC SHEET</div>
    </div>
    <div style="text-align: right; font-size: 0.85rem; font-weight: bold;">
      <div>DATE: <span id="current-date"></span></div>
      <div>POOL: 短水路 (25m)</div>
    </div>
  </div>

  <div class="concept-box" id="concept-display">
    🎯 TODAY'S CONCEPT: --
  </div>

  <table>
    <thead>
      <tr>
        <th style="width: 12%; text-align: center;">TIME</th>
        <th style="width: 15%;">PHASE / INTENSITY</th>
        <th style="width: 43%;">MENU DETAILS (COUNT × DIST @ CYCLE)</th>
        <th style="width: 30%;">COACH'S INTENT & INSTRUCTION</th>
      </tr>
    </thead>
    <tbody id="menu-tbody"></tbody>
  </table>
</div>

<script>
  document.getElementById('current-date').innerText = new Date().toLocaleDateString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit' }).replace(/\//g, '.');

  // 🏊 タイム基準（サークル倍率 & ベース秒数）
  const LEVEL_SETTINGS = {
    ADVANCED:     { base50: 45,  base100: 75,  base200: 160, label: "選手選抜・上級" },
    INTERMEDIATE: { base50: 55,  base100: 90,  base200: 190, label: "選手育成・中級" },
    JUNIOR:       { base50: 70,  base100: 110, base200: 240, label: "ジュニア・初級" }
  };

  // 🎯 テーマ別構造テンプレート
  const THEME_TEMPLATES = {
    SPEED: {
      concept: "Max Speed & Sprint Resistance Focus",
      phases: [
        { name: "Warm Up", intensity: "A1", dist: 200, volFactor: 2, cycleRef: "200", gear: "", intent: "ウォーミングアップと軸の確認。" },
        { name: "Drill", intensity: "A2", dist: 50,  volFactor: 6, cycleRef: "50",  gear: "Snorkel", intent: "ハイテンポ時のキャッチ位置とポジション維持。" },
        { name: "Kick & Pull", intensity: "En1", dist: 50, volFactor: 8, cycleRef: "50", gear: "Board", intent: "強いキックでオーバースピードへの準備。" },
        { name: "Main 1", intensity: "En2", dist: 50,  volFactor: 8, cycleRef: "50",  gear: "", intent: "メインに向けた心拍引き上げとテンポ維持。" },
        { name: "Main 2", intensity: "Sp1", dist: 50,  volFactor: 8, cycleRef: "50",  gear: "Fin", intent: "Max Speed発揮。ラストまでフォームを崩さない。" },
        { name: "Down", intensity: "A1", dist: 200, volFactor: 1, cycleRef: "200", gear: "", intent: "ダウン泳で代謝物質を流す。" }
      ]
    },
    ENDURANCE: {
      concept: "Aerobic Capacity & Target Pace Hold Focus",
      phases: [
        { name: "Warm Up", intensity: "A1", dist: 200, volFactor: 2, cycleRef: "200", gear: "", intent: "段階的な心拍数の向上と可動域確保。" },
        { name: "Drill", intensity: "A2", dist: 50,  volFactor: 8, cycleRef: "50",  gear: "Snorkel", intent: "重心移動と効率的なストロークの意識付け。" },
        { name: "Kick & Pull", intensity: "En1", dist: 50, volFactor: 12, cycleRef: "50", gear: "Paddle", intent: "体幹部からの連動性を意識した推進力の維持。" },
        { name: "Main 1", intensity: "En2", dist: 100, volFactor: 16, cycleRef: "100", gear: "Paddle", intent: "ATペースでの長距離Hold。効率的なストローク長を維持。" },
        { name: "Main 2", intensity: "Sp1", dist: 50,  volFactor: 6, cycleRef: "50",  gear: "", intent: "疲労下でのペースアップ刺激。" },
        { name: "Down", intensity: "A1", dist: 200, volFactor: 1, cycleRef: "200", gear: "", intent: "徐々に心拍数を下げてクールダウン。" }
      ]
    },
    TECHNIQUE: {
      concept: "Form Correction & Distance Per Stroke Focus",
      phases: [
        { name: "Warm Up", intensity: "A1", dist: 200, volFactor: 2, cycleRef: "200", gear: "", intent: "リラックスして体の伸びを感じる。" },
        { name: "Drill 1", intensity: "A2", dist: 50,  volFactor: 8, cycleRef: "50",  gear: "Snorkel", intent: "片手スイムでキャッチ＆ローテーションの確認。" },
        { name: "Drill 2", intensity: "A2", dist: 50,  volFactor: 8, cycleRef: "50",  gear: "Fin", intent: "フィンの推進力を活かした抵抗の少ない姿勢の保持。" },
        { name: "Kick & Pull", intensity: "En1", dist: 50, volFactor: 8, cycleRef: "50", gear: "Board", intent: "正しいキック打点とストローク数のカウント。" },
        { name: "Main 1", intensity: "En1", dist: 100, volFactor: 8, cycleRef: "100", gear: "", intent: "少ないストローク数（DPS）をキープして泳ぎ切る。" },
        { name: "Down", intensity: "A1", dist: 200, volFactor: 1, cycleRef: "200", gear: "", intent: "綺麗なフォームの余韻を残して終了。" }
      ]
    }
  };

  function formatTime(totalMinutes) {
    let hrs = Math.floor(totalMinutes / 60) % 24;
    let mins = Math.floor(totalMinutes % 60);
    return `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}`;
  }

  function generateMenu() {
    const themeKey = document.getElementById('theme-select').value;
    const levelKey = document.getElementById('level-select').value;
    const startTimeVal = document.getElementById('start-time').value || "10:00";

    const levelSetting = LEVEL_SETTINGS[levelKey];
    const themeTemplate = THEME_TEMPLATES[themeKey];

    document.getElementById('concept-display').innerText = `🎯 TODAY'S CONCEPT [${levelSetting.label}]: ${themeTemplate.concept}`;

    const [startH, startM] = startTimeVal.split(':').map(Number);
    let currentMin = startH * 60 + startM;

    const tbody = document.getElementById('menu-tbody');
    tbody.innerHTML = '';

    themeTemplate.phases.forEach(p => {
      // タイム基準から実際のサイクル秒数を取得
      let cycleSec = 60;
      if (p.cycleRef === "50") cycleSec = levelSetting.base50;
      if (p.cycleRef === "100") cycleSec = levelSetting.base100;
      if (p.cycleRef === "200") cycleSec = levelSetting.base200;

      let count = p.volFactor;
      let cycleM = Math.floor(cycleSec / 60);
      let cycleS = (cycleSec % 60).toString().padStart(2, '0');
      let cycleDisplay = `@ ${cycleM}:${cycleS}`;

      let durationSec = 0;
      let menuDetailsHtml = '';

      // 🚨 12本超の自動セット分割
      if (count > 12) {
        let sets = Math.ceil(count / 8);
        let countPerSet = Math.floor(count / sets);
        let setRest = 45;
        durationSec = (countPerSet * cycleSec * sets) + (setRest * (sets - 1));

        menuDetailsHtml = `
          <div class="set-header">${sets} SETS (Rest @ ${setRest}s)</div>
          <div class="menu-row"><span>${countPerSet} t × ${p.dist} m</span></div>
          <div style="margin-bottom:6px;">Fr ${p.name}</div>
          <div><span class="cycle-badge">${cycleDisplay}</span> ${p.gear ? `<span class="badge-gear">[${p.gear}]</span>` : ''}</div>
        `;
      } else {
        durationSec = count * cycleSec;
        menuDetailsHtml = `
          <div class="menu-row"><span>${count} t × ${p.dist} m</span></div>
          <div style="margin-bottom:6px;">Fr ${p.name}</div>
          <div><span class="cycle-badge">${cycleDisplay}</span> ${p.gear ? `<span class="badge-gear">[${p.gear}]</span>` : ''}</div>
        `;
      }

      let endMin = currentMin + (durationSec / 60);
      let timeDisplay = `${formatTime(currentMin)}<br>↓<br>${formatTime(endMin)}`;
      currentMin = endMin;

      let tr = document.createElement('tr');
      tr.innerHTML = `
        <td style="text-align: center; font-weight: bold; font-family: monospace; color: var(--text-sub);">
          ${timeDisplay}
        </td>
        <td>
          <div style="font-weight: bold; margin-bottom: 6px;">${p.name}</div>
          <span class="badge-zone zone-${p.intensity.toLowerCase()}">${p.intensity}</span>
        </td>
        <td>${menuDetailsHtml}</td>
        <td>
          <div class="stealth-editor" contenteditable="true">💡 ${p.intent}</div>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  window.onload = generateMenu;
</script>

</body>
</html>
